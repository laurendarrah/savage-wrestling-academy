name: Bug
description: Something on the site is broken or wrong
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      placeholder: Page address or screen name
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen, and what happened instead
    validations:
      required: true
  - type: dropdown
    id: real
    attributes:
      label: Real or sample data?
      options: ["Real family or payment data", "Sample or demo data", "Not sure"]
    validations:
      required: true
