<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scholarship invitation | Savage Wrestling Academy</title><link rel="stylesheet" href="/responsive.css"><style>
/* A scholarship offer: read the agreement, then sign. Design pass (issue #340): the form's width instead of a wide
   band, spacing, sizes and colors from the shared scale (public/savage.css gives the fonts, cards, buttons and
   fields), the agreement about 70 characters wide, and the notice as a white box with the red bar on its left. */
*{box-sizing:border-box}
body{margin:0;background:var(--swa-ground);color:var(--swa-ink)}
main{max-width:var(--swa-width-narrow);margin:auto;padding:var(--swa-s-16) 16px 56px}
html body main>section{margin:var(--swa-s-16) 0}
html body h2{margin:0 0 var(--swa-s-8)}
section p{margin:0 0 var(--swa-s-12)}
label{display:block;margin:var(--swa-s-16) 0}
input,select,textarea{display:block;width:100%;margin-top:6px}
html body main select,html body main input:not([type=checkbox]){max-width:420px}
input[type=checkbox]{display:inline;width:auto}
button:disabled{cursor:default}
.muted{font-size:var(--swa-t-15);color:var(--swa-muted)}
html body main .notice{padding:var(--swa-s-12) var(--swa-s-16);border:1px solid var(--swa-hair);border-left:6px solid var(--swa-red);border-radius:0;background:var(--swa-surface)}
.terms{white-space:pre-wrap;overflow-wrap:anywhere;padding:var(--swa-s-16);background:var(--swa-surface-2);border:1px solid var(--swa-line);border-radius:var(--swa-r-control);font-size:var(--swa-t-15);line-height:1.6}
.row{display:flex;flex-wrap:wrap;gap:var(--swa-s-12);align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--swa-s-16)}
[hidden]{display:none!important}
#status{font-weight:600;scroll-margin-top:80px;margin:0 0 var(--swa-s-8)}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.signature-canvas{display:block;width:100%;height:auto;aspect-ratio:4/1;border:1px solid #9A9EA7;border-radius:var(--swa-r-control);background:var(--swa-surface);touch-action:none}
.signature-panel{margin:var(--swa-s-16) 0;padding:var(--swa-s-16);background:var(--swa-surface-2);border:1px solid var(--swa-line);border-radius:var(--swa-r-control)}
.signature-panel h3{margin:0 0 var(--swa-s-4)}
.signature-panel p{margin:0 0 var(--swa-s-8);font-size:var(--swa-t-15);color:var(--swa-muted)}
html body .signature-panel button{margin-top:var(--swa-s-8)}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset:disabled .signature-canvas{opacity:.55}
</style></head><body><main><h1>Your SWA scholarship offer</h1><p id="status" role="status" aria-live="polite">Loading invitation…</p><section id="signin" hidden><h2>Use the invited parent email</h2><p>Sign in or create your family account in a new tab and save the invited wrestler. Then come back to this tab and choose the button below.</p><p><a href="/login" target="_blank" rel="noopener">Sign in / create account →</a> · <a href="/family" target="_blank" rel="noopener">Save your family profile →</a></p><button id="retry">I’ve signed in and saved my wrestler – refresh</button></section><section id="offer" hidden></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=new URLSearchParams(location.hash.slice(1)).get('token')||'',names={Elementary:'SWA Development',Intermediate:'SWA Intermediate',Advanced:'SWA Advance'};
let award=null,signatureStrokes=[],drawing=null,loads=0;
// Only the latest load draws the offer (issue #247): a refresh's older answer must not bring back a form already signed.
// The form stays disabled until the family's wrestlers are in and the signature pad listens, so nothing drawn is lost.
async function load(){
 const ticket=++loads;
 $('signin').hidden=true;$('offer').hidden=true;
 try{
  const r=await fetch('/api/scholarship',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'view',token})}),d=await r.json();
  if(ticket!==loads)return;
  if(r.status===401){$('signin').hidden=false;throw Error(d.error)}
  if(!r.ok)throw Error(d.error||'Unable to load invitation.');
  award=d.award;
  $('offer').innerHTML=`<h2>${esc(award.wrestler_name)}</h2><p>${esc(names[award.program])} · <strong>$0.00 tuition</strong></p>${d.accepted?`<p class="notice">Scholarship active. Your signed agreement is saved.</p><p><a href="/scholarship-agreement?id=${encodeURIComponent(award.id)}" target="_blank" rel="noopener">View / print signed agreement →</a> · <a href="/scholarship-agreement?id=${encodeURIComponent(award.id)}&amp;download=1">Download copy</a></p>`:award.terms_ready?'<p>Review the final agreement before accepting. Save the invited wrestler in your family profile first.</p>':'<p class="notice"><strong>This agreement isn’t final yet.</strong> You can accept it once the academy finishes it. The repayment wording below is only planned and doesn’t create any obligation now.</p>'}<div class="terms">${esc(award.terms_text)}</div>${!d.accepted&&award.terms_ready?'<form id="acceptForm"><fieldset id="acceptFields" disabled><label>Invited wrestler<select id="wrestler" required></select></label><label>Printed parent / guardian name<input id="signer" maxlength="120" minlength="2" required></label><div class="signature-panel"><h3>Parent / guardian signature</h3><div id="drawSignature"><p>Use your finger, mouse, or stylus to sign in the box.</p><canvas id="signatureCanvas" width="800" height="200" class="signature-canvas" aria-label="Draw your signature here"></canvas><button type="button" id="clearSignature">Clear signature</button></div><label>Date signed<input id="signatureDate" readonly aria-describedby="signatureDateHelp"></label><p id="signatureDateHelp" class="muted">The signing date is recorded automatically in New York time when you submit.</p></div><label><input type="checkbox" id="accepted" required> I am the parent/legal guardian and I have read and accept the agreement above.</label><label><input type="checkbox" id="electronicConsent" required> I consent to use an electronic signature for this agreement and intend my drawn signature to record my acceptance. I can save or print a copy of the signed agreement.</label><button id="accept" class="primary">Sign agreement & activate scholarship</button></fieldset></form>':''}<p class="muted">Scholarship tuition is free. Camps, clinics, additional paid practices, travel, and private lessons are separate unless stated in the final award. SWA Advance requires coach approval.</p>`;
  $('offer').hidden=false;$('status').textContent=d.accepted?'Scholarship active. View it in your family account.':award.terms_ready?'Review your final scholarship agreement.':'Your offer is saved. SWA will let you know when the agreement is ready.';
  if(!d.accepted&&award.terms_ready){const f=await fetch('/api/family',{cache:'no-store'}),family=await f.json();if(ticket!==loads)return;if(!f.ok)throw Error(family.error||'Save your family profile first.');const wrestlers=family.data.wrestlers.filter(w=>w.name.trim().toLowerCase()===award.wrestler_name.toLowerCase());$('wrestler').innerHTML=wrestlers.map(w=>`<option value="${esc(w.id)}">${esc(w.name)} · Grade ${esc(w.grade)}</option>`).join('');if(!wrestlers.length){$('accept').disabled=true;$('status').textContent='Add the invited wrestler to your family account and save it, then refresh this page.'}$('acceptForm').onsubmit=accept;setupSignature();$('acceptFields').disabled=false}
 }catch(e){if(ticket===loads)$('status').textContent=e.message}
}
function setupSignature(){
 signatureStrokes=[];drawing=null;
 const canvas=$('signatureCanvas'),context=canvas.getContext('2d');let activePointer=null;
 function redraw(){context.clearRect(0,0,canvas.width,canvas.height);context.strokeStyle='#18191c';context.lineWidth=2.5;context.lineCap='round';context.lineJoin='round';for(const stroke of signatureStrokes){if(stroke.length<2)continue;context.beginPath();stroke.forEach(([x,y],i)=>i?context.lineTo(x*canvas.width,y*canvas.height):context.moveTo(x*canvas.width,y*canvas.height));context.stroke()}}
 function point(e){const box=canvas.getBoundingClientRect();return [Math.round(Math.max(0,Math.min(1,(e.clientX-box.left)/box.width))*1000)/1000,Math.round(Math.max(0,Math.min(1,(e.clientY-box.top)/box.height))*1000)/1000]}
 $('signatureDate').value=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',month:'long',day:'numeric',year:'numeric'}).format(new Date());
 $('clearSignature').onclick=()=>{signatureStrokes=[];drawing=null;activePointer=null;redraw()};
 canvas.onpointerdown=e=>{if(e.isPrimary===false||drawing||signatureStrokes.length>=100)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);activePointer=e.pointerId;drawing=[point(e)];signatureStrokes.push(drawing)};
 canvas.onpointermove=e=>{if(!drawing||e.pointerId!==activePointer)return;e.preventDefault();if(signatureStrokes.reduce((n,s)=>n+s.length,0)>=2000)return;const p=point(e),last=drawing[drawing.length-1];if(Math.hypot(p[0]-last[0],p[1]-last[1])<.003)return;drawing.push(p);redraw()};
 canvas.onpointerup=e=>{if(e.pointerId!==activePointer)return;if(drawing?.length<2)signatureStrokes.pop();drawing=null;activePointer=null;redraw()};
 canvas.onpointercancel=e=>{if(e.pointerId!==activePointer)return;if(drawing)signatureStrokes.pop();drawing=null;activePointer=null;redraw()};
}
async function accept(e){e.preventDefault();if(!signatureStrokes.length){$('status').textContent='Draw your signature in the box before signing.';return}$('signatureDate').value=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',month:'long',day:'numeric',year:'numeric'}).format(new Date());$('accept').disabled=true;try{const r=await fetch('/api/scholarship',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'accept',token,revision:award.revision,wrestlerId:$('wrestler').value,signer:$('signer').value,accepted:$('accepted').checked,electronicConsent:$('electronicConsent').checked,signature:{method:'drawn',strokes:signatureStrokes}})}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to accept this offer.');await load()}catch(e){$('status').textContent=e.message;$('accept').disabled=false}}
$('retry').onclick=load;load();
</script></body></html>
