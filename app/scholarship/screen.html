<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scholarship invitation | Savage Wrestling Academy</title><link rel="stylesheet" href="/responsive.css"><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f6;color:#18191c;font:16px/1.65 Arial}main{max-width:960px;margin:auto;padding:24px}section,article{background:white;border:1px solid #ddd;border-radius:10px;padding:24px;margin:20px 0}h1,h2{line-height:1.2}a{color:#a92330}label{display:block;font-weight:bold;margin:16px 0}input,select,textarea,button{font:inherit;padding:12px;border:1px solid #ccc;border-radius:6px}input,select,textarea{display:block;width:100%;margin-top:6px}input[type=checkbox]{display:inline;width:auto}button{cursor:pointer;background:white;color:#18191c;min-height:44px}button:disabled{opacity:.55;cursor:default}.primary{background:#d72732;border-color:#d72732;color:white}.muted{font-size:14px;color:#646771}.notice{padding:16px;border-left:4px solid #d72732;background:#fff2f2}.pill{display:inline-block;background:#eee;padding:4px 8px;border-radius:5px;font-size:13px;font-weight:bold}.terms{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:#fafafa;border:1px solid #ddd;border-radius:6px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}[hidden]{display:none!important}#status{font-weight:bold;scroll-margin-top:20px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #227ab0;outline-offset:3px}@media(max-width:600px){main{padding:16px}section,article{padding:18px}.grid{grid-template-columns:1fr}}.signature-canvas{display:block;width:100%;height:auto;aspect-ratio:4/1;border:1px solid #999;border-radius:6px;background:white;touch-action:none}.signature-panel{margin:20px 0;padding:18px;background:#fafafa;border:1px solid #ddd;border-radius:6px}</style></head><body><main><a href="/family">← My family account</a><h1>Your SWA scholarship offer</h1><p id="status" role="status" aria-live="polite">Loading invitation…</p><section id="signin" hidden><h2>Use the invited parent email</h2><p>Sign in or create your family account in a separate tab. Save the invited wrestler’s profile, then return to this invitation.</p><p><a href="/login" target="_blank" rel="noopener">Sign in / create account →</a> · <a href="/family" target="_blank" rel="noopener">Save your family profile →</a></p><button id="retry">Reload invitation</button></section><section id="offer" hidden></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=new URLSearchParams(location.hash.slice(1)).get('token')||'',names={Elementary:'SWA Development',Intermediate:'SWA Intermediate',Advanced:'SWA Advance'};
let award=null,signatureStrokes=[],drawing=null;
async function load(){
 $('signin').hidden=true;$('offer').hidden=true;
 try{
  const r=await fetch('/api/scholarship',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'view',token})}),d=await r.json();
  if(r.status===401){$('signin').hidden=false;throw Error(d.error)}
  if(!r.ok)throw Error(d.error||'Unable to load invitation.');
  award=d.award;
  $('offer').innerHTML=`<h2>${esc(award.wrestler_name)}</h2><p>${esc(names[award.program])} · <strong>$0.00 tuition</strong></p>${d.accepted?`<p class="notice">Scholarship active. Your signed agreement is saved.</p><p><a href="/scholarship-agreement?id=${encodeURIComponent(award.id)}" target="_blank" rel="noopener">View / print signed agreement →</a> · <a href="/scholarship-agreement?id=${encodeURIComponent(award.id)}&amp;download=1">Download copy</a></p>`:award.terms_ready?'<p>Review the final agreement before accepting. Save the invited wrestler in your family profile first.</p>':'<p class="notice"><strong>Draft for attorney review.</strong> Acceptance is closed while SWA finalizes this agreement. The proposed repayment language does not create an obligation at this stage.</p>'}<div class="terms">${esc(award.terms_text)}</div>${!d.accepted&&award.terms_ready?'<form id="acceptForm"><label>Invited wrestler<select id="wrestler" required></select></label><label>Printed parent / guardian name<input id="signer" maxlength="120" minlength="2" required></label><div class="signature-panel"><h3>Parent / guardian signature</h3><div id="drawSignature"><p>Use your finger, mouse, or stylus to sign in the box.</p><canvas id="signatureCanvas" width="800" height="200" class="signature-canvas" aria-label="Draw your signature here"></canvas><button type="button" id="clearSignature">Clear signature</button></div><label>Date signed<input id="signatureDate" readonly aria-describedby="signatureDateHelp"></label><p id="signatureDateHelp" class="muted">The signing date is recorded automatically in New York time when you submit.</p></div><label><input type="checkbox" id="accepted" required> I am the parent/legal guardian and I have read and accept the agreement above.</label><label><input type="checkbox" id="electronicConsent" required> I consent to use an electronic signature for this agreement and intend my drawn signature to record my acceptance. I can save or print a copy of the signed agreement.</label><button id="accept" class="primary">Sign agreement & activate scholarship</button></form>':''}<p class="muted">Scholarship tuition is free. Camps, clinics, additional paid practices, travel, and private lessons are separate unless stated in the final award. SWA Advance requires coach approval.</p>`;
  $('offer').hidden=false;$('status').textContent=d.accepted?'Scholarship active. View it in your family account.':award.terms_ready?'Review your final scholarship agreement.':'Your offer is saved. SWA will let you know when the agreement is ready.';
  if(!d.accepted&&award.terms_ready){const f=await fetch('/api/family',{cache:'no-store'}),family=await f.json();if(!f.ok)throw Error(family.error||'Save your family profile first.');const wrestlers=family.data.wrestlers.filter(w=>w.name.trim().toLowerCase()===award.wrestler_name.toLowerCase());$('wrestler').innerHTML=wrestlers.map(w=>`<option value="${esc(w.id)}">${esc(w.name)} · Grade ${esc(w.grade)}</option>`).join('');if(!wrestlers.length){$('accept').disabled=true;$('status').textContent='Add the invited wrestler to your saved family profile, then reload this invitation.'}$('acceptForm').onsubmit=accept;setupSignature();}
 }catch(e){$('status').textContent=e.message}
}
function setupSignature(){
 signatureStrokes=[];drawing=null;
 const canvas=$('signatureCanvas'),context=canvas.getContext('2d');let activePointer=null;
 function redraw(){context.clearRect(0,0,canvas.width,canvas.height);context.strokeStyle='#18191c';context.lineWidth=2.5;context.lineCap='round';context.lineJoin='round';for(const stroke of signatureStrokes){if(stroke.length<2)continue;context.beginPath();stroke.forEach(([x,y],i)=>i?context.lineTo(x*canvas.width,y*canvas.height):context.moveTo(x*canvas.width,y*canvas.height));context.stroke()}}
 function point(e){const box=canvas.getBoundingClientRect();return [Math.round(Math.max(0,Math.min(1,(e.clientX-box.left)/box.width))*1000)/1000,Math.round(Math.max(0,Math.min(1,(e.clientY-box.top)/box.height))*1000)/1000]}
 $('signatureDate').value=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',month:'long',day:'numeric',year:'numeric'}).format(new Date());
 $('clearSignature').onclick=()=>{signatureStrokes=[];drawing=null;activePointer=null;redraw()};
 canvas.onpointerdown=e=>{if(e.isPrimary===false||drawing||signatureStrokes.length>=100)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);activePointer=e.pointerId;drawing=[point(e)];signatureStrokes.push(drawing)};
 canvas.onpointermove=e=>{if(!drawing||e.pointerId!==activePointer)return;e.preventDefault();if(signatureStrokes.reduce((n,s)=>n+s.length,0)>=2000)return;const p=point(e),last=drawing[drawing.length-1];if(Math.hypot(p[0]-last[0],p[1]-last[1])<.003)return;drawing.push(p);redraw()};
 canvas.onpointerup=e=>{if(e.pointerId!==activePointer)return;if(drawing?.length<2)signatureStrokes.pop();drawing=null;activePointer=null;redraw()};
 canvas.onpointercancel=e=>{if(e.pointerId!==activePointer)return;if(drawing)signatureStrokes.pop();drawing=null;activePointer=null;redraw()};
}
async function accept(e){e.preventDefault();$('signatureDate').value=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',month:'long',day:'numeric',year:'numeric'}).format(new Date());$('accept').disabled=true;try{const r=await fetch('/api/scholarship',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'accept',token,revision:award.revision,wrestlerId:$('wrestler').value,signer:$('signer').value,accepted:$('accepted').checked,electronicConsent:$('electronicConsent').checked,signature:{method:'drawn',strokes:signatureStrokes}})}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to accept this offer.');await load()}catch(e){$('status').textContent=e.message;$('accept').disabled=false}}
$('retry').onclick=load;load();
</script></body></html>
