<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Savage Wrestling Academy LLC</title><style>
/* Sign in, sign up and password reset: one centered card on the textured black (public/savage.css gives the page its
   backdrop, the logo above the card and the fonts). Design pass (issue #340): spacing and sizes from the shared scale,
   the heading sits at the top of the card without a gap, the links under the form are quiet ink so the red button is
   the one action. */
*{box-sizing:border-box}
body{margin:0;color:var(--swa-ink)}
main{max-width:440px;margin:0 auto;padding:var(--swa-s-32) 16px var(--swa-s-48)}
html body h1{margin:0 0 var(--swa-s-8)}
#intro{margin:0 0 var(--swa-s-16);color:var(--swa-muted);font-size:var(--swa-t-15)}
label{display:block;margin:var(--swa-s-16) 0 0}
input{display:block;width:100%;margin-top:6px}
.password-row{display:flex;align-items:center;gap:var(--swa-s-8)}
.password-row input{min-width:0;flex:1 1 auto}
html body .password-row button{flex:none;margin-top:6px;padding:0 var(--swa-s-12);font-size:var(--swa-t-15)}
#passwordHelp{display:block;margin-top:6px;font-weight:400;font-size:var(--swa-t-13);color:var(--swa-muted)}
html body button.primary{width:100%;margin-top:var(--swa-s-24);min-height:var(--swa-h-big)}
button:disabled{cursor:wait}
#message{margin-top:var(--swa-s-16);padding:var(--swa-s-12) var(--swa-s-16);border-radius:var(--swa-r-control);background:var(--swa-surface-2);font-size:var(--swa-t-15);white-space:pre-wrap}
#message:empty{display:none}
.links{display:flex;flex-wrap:wrap;gap:0 var(--swa-s-16);justify-content:space-between;margin-top:var(--swa-s-16)}
html body main button.link{color:var(--swa-ink);font-size:var(--swa-t-15);font-weight:600;text-decoration-color:#CDD0D6}
html body main button.link:hover{color:var(--swa-red)}
footer{margin-top:var(--swa-s-24);text-align:center;font-size:var(--swa-t-13)}
footer p{margin:var(--swa-s-4) 0 0}
footer a{font-size:var(--swa-t-15)}
[hidden]{display:none!important}
</style><link rel="stylesheet" href="/responsive.css"></head><body><main><section class="card"><h1 id="heading">Welcome back</h1><p id="intro">Sign in with your email address and password.</p><form id="accountForm"><label id="emailLabel">Email address<input id="email" type="email" autocomplete="email" maxlength="254" required></label><label id="passwordLabel">Password<div class="password-row"><input id="password" type="password" autocomplete="current-password" maxlength="128" required><button type="button" id="show" aria-label="Show password">Show</button></div><small id="passwordHelp" hidden>Use 12–128 characters. A long passphrase works well.</small></label><label id="confirmLabel" hidden>Confirm password<input id="confirm" type="password" autocomplete="new-password" maxlength="128"></label><button class="primary" id="submit">Sign in</button></form><div id="message" role="status" aria-live="polite"></div><div class="links"><button class="link" id="toSignup" onclick="setMode('signup')">New here? Create an account</button><button class="link" id="toReset" onclick="setMode('reset')">Forgot your password?</button><button class="link" id="toLogin" onclick="setMode('login')" hidden>Back to sign in</button></div><div class="links" id="resendRow"><button class="link" onclick="setMode('resend')">Didn’t get the confirmation email?</button></div></section><footer>Savage Wrestling Academy · Huntington Station, NY<p><a href="/calendar" target="_top">See the practice calendar</a></p></footer></main><script src="/registration-return.js"></script><script>
const $=id=>document.getElementById(id);let mode='login';
function setMode(next){mode=next;const settings={login:['Welcome back','Sign in with your email address and password.','Sign in'],signup:['Create your account','One parent account for your family. Confirm your email before signing in.','Create account'],reset:['Reset your password','We’ll email a secure password reset link.','Send reset link'],resend:['Confirm your email','Enter your email address and we’ll send a new confirmation link.','Send confirmation link'],change:['Choose a new password','Open your reset link on the same browser where you requested it.','Save new password']}[next];$('heading').textContent=settings[0];$('intro').textContent=settings[1];$('submit').textContent=settings[2];$('emailLabel').hidden=next==='change';$('email').required=next!=='change';const passwordNeeded=['login','signup','change'].includes(next);$('passwordLabel').hidden=!passwordNeeded;$('password').required=passwordNeeded;$('password').minLength=next==='login'?1:12;$('password').autocomplete=next==='login'?'current-password':'new-password';$('confirmLabel').hidden=!['signup','change'].includes(next);$('confirm').required=['signup','change'].includes(next);$('passwordHelp').hidden=!['signup','change'].includes(next);$('toSignup').hidden=$('toReset').hidden=$('resendRow').hidden=next!=='login';$('toLogin').hidden=next==='login'||next==='change';$('message').textContent='';$('password').value='';$('confirm').value=''}
$('show').onclick=()=>{const hidden=$('password').type==='password';$('password').type=hidden?'text':'password';$('show').textContent=hidden?'Hide':'Show';$('show').setAttribute('aria-label',hidden?'Hide password':'Show password')};
$('accountForm').onsubmit=async event=>{event.preventDefault();if(['signup','change'].includes(mode)&&$('password').value!==$('confirm').value){$('message').textContent='The passwords do not match.';return}$('submit').disabled=true;$('message').textContent='Please wait…';try{const response=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:mode,email:$('email').value,password:$('password').value})});const body=await response.json();if(!response.ok)throw Error(body.error||'Unable to finish. Please try again.');$('password').value='';$('confirm').value='';if(body.redirect){const target=body.redirect==='/security'?body.redirect:(globalThis.SavageReturn?.take()||body.redirect);location.assign(target);return}$('message').textContent=body.message||'Done.'}catch(error){$('message').textContent=error.message}finally{$('submit').disabled=false}};
const params=new URLSearchParams(location.search);if(params.get('mode')==='change')setMode('change');else if(params.get('mode')==='signup')setMode('signup');if(params.has('reauth'))$('message').textContent='Please sign in again to continue.';if(params.has('confirmed'))$('message').textContent='Email confirmed. You can now sign in.';if(params.has('confirmation'))$('message').textContent='That confirmation link expired or could not be verified. Request another confirmation email.';
</script></body></html>
