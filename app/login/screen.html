<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Savage Wrestling Academy LLC</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f6;color:#18191c;font:15px Arial,sans-serif;line-height:1.6}main{max-width:470px;margin:6vh auto;padding:28px}.brand{font-size:37px;font-weight:900;font-style:italic;letter-spacing:-1px}.brand small{display:block;font-size:10px;font-weight:600;font-style:normal;letter-spacing:2px;margin-bottom:28px}.card{background:white;border:1px solid #e5e5e7;border-radius:12px;padding:26px}h1{font-size:26px;line-height:1.2}p{color:#656872;font-size:14px}label{display:block;margin:16px 0;font-weight:600;font-size:13px}input,button{font:inherit}input{display:block;width:100%;padding:13px;border:1px solid #dcdce0;border-radius:6px;margin-top:6px}button{cursor:pointer;border-radius:6px;padding:12px;border:1px solid #dcdce0;background:white;color:#18191c}button.primary{width:100%;background:#d72732;border-color:#d72732;color:white;font-weight:700}button:disabled{opacity:.6;cursor:wait}.links{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin-top:18px}.link{border:0;background:transparent;padding:0;font-size:13px;text-decoration:underline;color:#555}a{color:#555;font-size:13px}#message{font-size:14px;margin-top:18px;padding:12px;border-radius:6px;background:#f2f2f4;white-space:pre-wrap}#message:empty{display:none}.password-row{display:flex;align-items:center;gap:8px}.password-row input{min-width:0}.password-row button{font-size:12px;margin-top:6px}footer{font-size:11px;color:#5f626b;margin-top:20px}[hidden]{display:none!important}
</style><link rel="stylesheet" href="/responsive.css"></head><body><main><div class="brand">SAVAGE<small>WRESTLING ACADEMY LLC</small></div><section class="card"><h1 id="heading">Welcome back.</h1><p id="intro">Sign in with your email address and password.</p><form id="accountForm"><label id="emailLabel">Email address<input id="email" type="email" autocomplete="email" maxlength="254" required></label><label id="passwordLabel">Password<div class="password-row"><input id="password" type="password" autocomplete="current-password" maxlength="128" required><button type="button" id="show" aria-label="Show password">Show</button></div><small id="passwordHelp" hidden>Use 12–128 characters. A long passphrase works well.</small></label><label id="confirmLabel" hidden>Confirm password<input id="confirm" type="password" autocomplete="new-password" maxlength="128"></label><button class="primary" id="submit">Sign in</button></form><div id="message" role="status" aria-live="polite"></div><div class="links"><button class="link" onclick="setMode('signup')">Create an account</button><button class="link" onclick="setMode('reset')">Forgot password?</button><button class="link" onclick="setMode('login')">Back to sign in</button></div><div style="margin-top:16px"><button class="link" onclick="setMode('resend')">Resend confirmation email</button></div></section><footer>Owner: use savagewrestlingclub@gmail.com for your email-and-password account.<br>Customer registration is being tested. Payments are not enabled.<p><a href="/" target="_top">Back to academy workspace</a></p></footer></main><script src="/registration-return.js"></script><script>
const $=id=>document.getElementById(id);let mode='login';
function setMode(next){mode=next;const settings={login:['Welcome back.','Sign in with your email address and password.','Sign in'],signup:['Create your account.','One parent account for your family. Confirm your email before signing in.','Create account'],reset:['Reset your password.','We’ll email a secure password reset link.','Send reset link'],resend:['Confirm your email.','Request another account confirmation email.','Resend confirmation'],change:['Choose a new password.','Open your reset link on the same browser where you requested it.','Save new password']}[next];$('heading').textContent=settings[0];$('intro').textContent=settings[1];$('submit').textContent=settings[2];$('emailLabel').hidden=next==='change';$('email').required=next!=='change';const passwordNeeded=['login','signup','change'].includes(next);$('passwordLabel').hidden=!passwordNeeded;$('password').required=passwordNeeded;$('password').minLength=next==='login'?1:12;$('password').autocomplete=next==='login'?'current-password':'new-password';$('confirmLabel').hidden=!['signup','change'].includes(next);$('confirm').required=['signup','change'].includes(next);$('passwordHelp').hidden=!['signup','change'].includes(next);$('message').textContent='';$('password').value='';$('confirm').value=''}
$('show').onclick=()=>{const hidden=$('password').type==='password';$('password').type=hidden?'text':'password';$('show').textContent=hidden?'Hide':'Show';$('show').setAttribute('aria-label',hidden?'Hide password':'Show password')};
$('accountForm').onsubmit=async event=>{event.preventDefault();if(['signup','change'].includes(mode)&&$('password').value!==$('confirm').value){$('message').textContent='The passwords do not match.';return}$('submit').disabled=true;$('message').textContent='Please wait…';try{const response=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:mode,email:$('email').value,password:$('password').value})});const body=await response.json();if(!response.ok)throw Error(body.error||'Unable to finish. Please try again.');$('password').value='';$('confirm').value='';if(body.redirect){const target=body.redirect==='/security'?body.redirect:(globalThis.SavageReturn?.take()||body.redirect);location.assign(target);return}$('message').textContent=body.message||'Done.'}catch(error){$('message').textContent=error.message}finally{$('submit').disabled=false}};
const params=new URLSearchParams(location.search);if(params.get('mode')==='change')setMode('change');else if(params.get('mode')==='signup')setMode('signup');if(params.has('reauth'))$('message').textContent='Please sign in again to continue.';if(params.has('confirmed'))$('message').textContent='Email confirmed. You can now sign in.';if(params.has('confirmation'))$('message').textContent='That confirmation link expired or could not be verified. Request another confirmation email.';
</script></body></html>
