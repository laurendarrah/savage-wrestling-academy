<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roster and check-in | Savage Wrestling Academy</title><style>*{box-sizing:border-box}body{font:16px Arial,sans-serif;line-height:1.5;background:#f5f5f6;color:#18191c;margin:0}main{max-width:900px;margin:auto;padding:20px 16px 60px}h1{line-height:1.15;margin:12px 0 4px}a{color:#a92330}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:16px 0}.toolbar label{display:flex;flex-direction:column;font-weight:bold;font-size:14px}input,button{font:inherit}input{padding:10px;border:1px solid #ccc;border-radius:6px}button{padding:10px 14px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#18191c;cursor:pointer}button.primary{background:#d72732;border-color:#d72732;color:#fff}button:disabled{opacity:.55}.session{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;margin:16px 0}.session-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}.session-head h2{margin:0;font-size:20px}.count{font-weight:bold}.muted{color:#626672}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #eee;padding:12px 0;flex-wrap:wrap}.row.done{background:#f3faf4}.who{min-width:220px;flex:1}.who strong{font-size:17px}.badge{display:inline-block;font-size:12px;font-weight:bold;background:#eef0f3;border-radius:999px;padding:2px 8px;margin:2px 4px 0 0}.badge.ok{background:#dff3e3;color:#11632a}.badge.warn{background:#fde8e8;color:#8a1c1c}.row.card-problem{border-left:4px solid #d72732;padding-left:10px}.empty{color:#626672;font-style:italic}#status{font-weight:bold;min-height:1.5em}@media print{.toolbar,button{display:none}.session{break-inside:avoid;border:0}}</style><link rel="stylesheet" href="/responsive.css"></head><body><main><a id="home" href="/">← Workspace</a><h1>Roster &amp; check-in</h1><p class="muted">Wrestlers listed here have a paid membership, a paid walk-in or registration, or an active scholarship for the session. Times are New York time.</p><div class="toolbar"><label id="dateLabel">Date<input type="date" id="date"></label><label>Find a wrestler<input type="search" id="search" placeholder="Name" autocomplete="off"></label><button id="refresh" type="button">Refresh</button><button type="button" onclick="window.print()">Print</button></div><p id="status" role="status" aria-live="polite">Loading roster…</p><div id="sessions"></div></main><script>
const cardBad=e=>['missing','expired','invalid'].includes(e.card);
// USA Wrestling card on the session date (issue #68). Check-in is allowed; staff follow up with the family.
function cardBadge(e){const d=e.cardExpires?new Date(e.cardExpires+'T12:00:00Z').toLocaleDateString('en-US',{timeZone:'UTC',month:'short',day:'numeric',year:'numeric'}):'';
 return e.card==='missing'?'<span class="badge warn">No USA Wrestling card</span>':e.card==='expired'?'<span class="badge warn">USA Wrestling card expired '+esc(d)+'</span>':e.card==='invalid'?'<span class="badge warn">USA Wrestling card not valid'+(e.cardNote?': '+esc(e.cardNote):'')+'</span>':e.card==='verified'?'<span class="badge">Card verified</span>':''}

const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clock=t=>{if(!t)return '';const [h,m]=t.split(':').map(Number);return (h%12||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'AM':'PM')};
const timeOf=iso=>new Date(iso).toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'});
let data=null,busy=false;
async function call(url,body){const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Roster unavailable.');return d}
function render(){
 if(!data)return;
 const q=$('search').value.trim().toLowerCase();
 if(!data.sessions.length){$('sessions').innerHTML='<p class="empty">No practices, camps or sessions are scheduled for this date.</p>';return}
 $('sessions').innerHTML=data.sessions.map((s,si)=>{
  const list=s.entries.filter(e=>!q||e.name.toLowerCase().includes(q));
  const when=s.start?clock(s.start)+'–'+clock(s.end):'All day';
  return `<section class="session"><div class="session-head"><h2>${esc(s.title)}</h2><span class="count">${s.checkedIn} of ${s.entries.length} checked in</span></div><p class="muted">${esc(when)}${s.type==='live'?' · Separate purchase':s.type==='event'?' · Camp, clinic or event':''}</p>${list.length?list.map((e,ei)=>`<div class="row${e.checkedInAt?' done':''}${cardBad(e)?' card-problem':''}"><div class="who"><strong>${esc(e.name)}</strong>${e.grade?` <span class="muted">· ${e.grade==='K'?'Kindergarten':e.grade==='Adult'?'Adult':'Grade '+esc(e.grade)}</span>`:''}<div>${e.sources.map(x=>`<span class="badge ok">${esc(x)}</span>`).join('')}${cardBadge(e)}</div><div class="muted">${esc(e.parentName||'Parent name not saved')}${e.phone?' · <a href="tel:'+esc(e.phone)+'">'+esc(e.phone)+'</a>':''}${e.email?' · '+esc(e.email):''}</div></div><div>${e.checkedInAt?`<span class="badge ok">Checked in ${esc(timeOf(e.checkedInAt))}</span> <button type="button" data-undo="${si}:${ei}">Undo</button>`:`<button class="primary" type="button" data-checkin="${si}:${ei}">Check in</button>`}</div></div>`).join(''):`<p class="empty">${s.entries.length?'No wrestler matches that name.':'Nobody is registered for this session yet.'}</p>`}</section>`}).join('');
 const pick=v=>{const [si,ei]=v.split(':').map(Number),s=data.sessions[si],list=s.entries.filter(e=>!q||e.name.toLowerCase().includes(q));return {s,e:list[ei]}};
 document.querySelectorAll('[data-checkin]').forEach(b=>b.onclick=()=>{const {s,e}=pick(b.dataset.checkin);act('checkin',s,e)});
 document.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{const {s,e}=pick(b.dataset.undo);if(confirm('Undo check-in for '+e.name+'?'))act('undo',s,e)});
}
async function act(action,s,e){if(busy)return;busy=true;$('status').textContent=action==='checkin'?'Checking in '+e.name+'…':'Undoing…';try{const d=await call('/api/roster',{action,date:data.date,sessionKey:s.key,userId:e.userId,wrestlerId:e.wrestlerId});data.sessions=d.sessions;render();$('status').textContent=action==='checkin'?e.name+' checked in.':'Check-in removed for '+e.name+'.'}catch(err){$('status').textContent=err.message}finally{busy=false}}
async function load(date){$('status').textContent='Loading roster…';try{data=await call('/api/roster'+(date?'?date='+encodeURIComponent(date):''));$('date').value=data.date;$('dateLabel').hidden=data.role!=='owner';$('home').href=data.role==='owner'?'/':'/coach';$('home').textContent=data.role==='owner'?'← Workspace':'← Coach workspace';render();const total=data.sessions.reduce((n,s)=>n+s.entries.length,0);$('status').textContent=data.sessions.length?total+' registered across '+data.sessions.length+' session'+(data.sessions.length===1?'':'s')+'.':'Nothing scheduled.'}catch(e){$('status').textContent=e.message}}
$('date').onchange=()=>load($('date').value);$('search').oninput=render;$('refresh').onclick=()=>load(data?.date);
load(new URLSearchParams(location.search).get('date')||'');
</script></body></html>
