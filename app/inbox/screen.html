<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages | Savage Wrestling Academy</title><style>*{box-sizing:border-box}body{font:16px Arial,sans-serif;line-height:1.5;background:#f5f5f6;color:#18191c;margin:0}main{max-width:760px;margin:auto;padding:20px 16px 60px}h1{line-height:1.15;margin:12px 0 4px}h2{margin:0 0 10px;font-size:20px}a{color:#a92330}section{background:#fff;border:1px solid #ddd;border-radius:10px;padding:20px;margin:18px 0}.muted{color:#626672}details{border-top:1px solid #eee;padding:10px 0}details:first-of-type{border-top:0}summary{cursor:pointer}summary.unread{font-weight:bold}.body{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 0}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#d72732;margin-right:6px}.msg{border-radius:10px;padding:10px 12px;margin:8px 0;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}.msg.you{background:#18191c;color:#fff;margin-left:auto}.msg.academy{background:#eef0f3}.msg small{display:block;opacity:.7;font-size:12px}label{display:flex;flex-direction:column;font-weight:bold;gap:4px}textarea,button{font:inherit}textarea{padding:9px;border:1px solid #ccc;border-radius:6px;min-height:90px}button{padding:10px 14px;border:1px solid #d72732;border-radius:6px;background:#d72732;color:#fff;cursor:pointer;margin-top:8px}#status{font-weight:bold;min-height:1.5em}</style><link rel="stylesheet" href="/responsive.css"></head><body><main><a href="/family">← Family account</a><h1>Messages</h1><p id="status" role="status" aria-live="polite">Loading…</p>
<section><h2>Announcements</h2><div id="announcements"></div></section>
<section><h2>Your conversation with the academy</h2><div id="thread"></div><form id="reply"><label>Message the academy<textarea id="body" maxlength="5000" required></textarea></label><button>Send</button></form></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=d=>new Date(d).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
async function call(body){const r=await fetch('/api/inbox',body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{cache:'no-store'});if(r.status===401){location.href='/login';throw Error('Sign in again.')}const d=await r.json();if(!r.ok)throw Error(d.error||'Something went wrong.');return d}
function render(d){
 $('announcements').innerHTML=d.announcements.map(a=>`<details data-id="${esc(a.id)}"><summary class="${a.read?'':'unread'}">${a.read?'':'<span class="dot" aria-label="Unread"></span>'}${esc(a.subject)} <span class="muted">· ${esc(when(a.sentAt))}</span></summary><div class="body">${esc(a.body)}</div></details>`).join('')||'<p class="muted">No announcements yet.</p>';
 document.querySelectorAll('details[data-id]').forEach(el=>el.ontoggle=()=>{if(el.open&&el.querySelector('.unread'))call({action:'read',announcementId:el.dataset.id}).then(x=>{el.querySelector('summary').classList.remove('unread');el.querySelector('.dot')?.remove()}).catch(()=>{})});
 $('thread').innerHTML=d.thread.map(m=>`<div class="msg ${m.from}">${esc(m.body)}<small>${m.from==='you'?'You':'Savage Wrestling Academy'} · ${esc(when(m.at))}</small></div>`).join('')||'<p class="muted">No messages yet. Questions about schedules, payments or your wrestler? Write to the academy here.</p>';
}
$('reply').onsubmit=async e=>{e.preventDefault();try{render(await call({action:'reply',body:$('body').value}));$('body').value='';$('status').textContent='Sent. The academy will reply here.'}catch(err){$('status').textContent=err.message}};
(async()=>{try{const d=await call();render(d);if(d.thread.length)await call({action:'read',thread:true});$('status').textContent=''}catch(e){$('status').textContent=e.message}})();
</script></body></html>
