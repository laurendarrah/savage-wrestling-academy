<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entry pass | Savage Wrestling Academy</title><style>
/* The entry pass (redesign Phase 2, issue #282; design pass, issue #340): the wrestler's pass card at full brightness
   on the dark page, the name at 42px and the next session beneath the code as the academy's practice box (the day,
   then the session in caps with the time larger under it). Replacing a pass is a quiet line under the card. */
*{box-sizing:border-box}body{margin:0}main{max-width:460px;margin:auto;padding:var(--swa-s-16) 16px 60px}
.pass{background:var(--swa-surface);border-radius:var(--swa-r-card);padding:var(--swa-s-24) var(--swa-s-16);margin:var(--swa-s-16) 0 var(--swa-s-8);text-align:center}
.pass h2{overflow-wrap:anywhere}
.qr{max-width:300px;margin:var(--swa-s-16) auto}.qr svg{width:100%;height:auto;display:block}
.pass .next{margin:0;font-size:var(--swa-t-15);color:var(--swa-muted);line-height:1.4}
.pass .swa-day{margin:var(--swa-s-8) 0}
.pass .swa-practice{max-width:300px;margin:0 auto}
html body .pass .swa-practice__time{font-size:var(--swa-t-29)}
html body #passes>.empty{color:var(--swa-dark-muted)}
.pass-tools{margin:0 0 var(--swa-s-24);text-align:center;font-size:var(--swa-t-13);color:var(--swa-dark-muted)}
html body .pass-tools button.quiet{color:var(--swa-dark-text);text-decoration-color:var(--swa-dark-muted);font-size:var(--swa-t-15)}
#status{font-weight:600;min-height:1.5em}
</style><script src="/qr-preview.js" defer></script><link rel="stylesheet" href="/responsive.css"></head><body><main><h1>Entry pass</h1><p class="muted">Show it at the door with the screen bright; staff scan it to check your wrestler in.</p><p id="status" role="status" aria-live="polite">Loading…</p><div id="passes"></div></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let passes=[],next={};
const clock=t=>{if(!t)return 'All day';const [h,m]=t.split(':').map(Number);return (h%12||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'AM':'PM')};
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});
const dayName=d=>d===today()?'Today':new Date(Date.parse(today()+'T12:00:00Z')+864e5).toISOString().slice(0,10)===d?'Tomorrow':new Date(d+'T12:00:00Z').toLocaleDateString('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric'});
const shown=()=>{const only=new URLSearchParams(location.search).get('wrestler');return passes.filter(p=>!only||p.wrestlerId===only)};
// The next session under the code: "Today · 6:00 PM · SWA Intermediate", from the wrestler view's own list.
function nextLine(p){const n=next[p.wrestlerId];if(n===undefined)return '';if(!n)return '<p class="next">Nothing booked in the next three weeks.</p>';const day=dayName(n.date);return '<p class="swa-day">Next up'+(day==='Today'?'<b class="today">Today</b>':' · '+esc(day))+'</p><div class="swa-practice"><p class="swa-practice__name">'+esc(n.title)+'</p><p class="swa-practice__time">'+esc(clock(n.start))+'</p></div>'}
function render(){
 const list=shown();
 $('passes').innerHTML=list.map(p=>`<section class="pass" aria-label="Entry pass for ${esc(p.name)}"><div class="brand">Savage Wrestling Academy</div><h2>${esc(p.name)}</h2><div class="qr">${window.qrSvg(p.code,'Entry pass for '+p.name)}</div>${nextLine(p)}</section><p class="pass-tools">Issued ${esc(new Date(p.createdAt).toLocaleDateString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',year:'numeric'}))} · <button type="button" class="quiet" data-replace="${esc(p.wrestlerId)}">Replace this pass</button><br>Replace it if a screenshot was shared or a phone was lost. The old pass stops working at once.</p>`).join('')||'<div class="empty"><p>Add a wrestler in your family account to get a pass.</p><a class="button" href="/family">Family account</a></div>';
 document.querySelectorAll('[data-replace]').forEach(b=>b.onclick=async()=>{if(!confirm('Replace this pass? The current code stops working immediately.'))return;try{const r=await fetch('/api/passes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'replace',wrestlerId:b.dataset.replace})}),d=await r.json();if(!r.ok)throw Error(d.error||'Could not replace the pass.');passes=d.passes;render();$('status').textContent='New pass ready. The old one no longer works.'}catch(e){$('status').textContent=e.message}});
}
async function loadNext(){for(const p of shown()){try{const r=await fetch('/api/wrestler?id='+encodeURIComponent(p.wrestlerId),{cache:'no-store'}),d=r.ok?await r.json():null;next[p.wrestlerId]=d&&Array.isArray(d.upcoming)?d.upcoming[0]||null:null}catch{next[p.wrestlerId]=null}}render()}
async function load(){try{const r=await fetch('/api/passes',{cache:'no-store'});if(r.status===401){location.href='/login';return}const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load passes.');passes=d.passes;$('status').textContent='';render();loadNext()}catch(e){$('status').textContent=e.message}}
window.addEventListener('DOMContentLoaded',load);
</script></body></html>
