<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entry pass | Savage Wrestling Academy</title><style>*{box-sizing:border-box}body{font:16px Arial,sans-serif;line-height:1.5;background:#f5f5f6;color:#18191c;margin:0}main{max-width:560px;margin:auto;padding:20px 16px 60px}h1{line-height:1.15;margin:12px 0 4px}a{color:#a92330}.pass{background:#fff;border:1px solid #ddd;border-radius:14px;padding:22px;margin:18px 0;text-align:center}.pass h2{margin:0;font-size:26px}.brand{letter-spacing:.2em;font-weight:bold;color:#d72732;font-size:13px}.qr{max-width:300px;margin:14px auto}.qr svg{width:100%;height:auto;display:block}.muted{color:#626672}button{font:inherit;padding:9px 14px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer}#status{font-weight:bold;min-height:1.5em}</style><script src="/qr-preview.js" defer></script><link rel="stylesheet" href="/responsive.css"></head><body><main><h1>Entry passes</h1><p class="muted">Show the pass at the door; staff scan it to check your wrestler in. Turn your screen brightness up. The pass only works for sessions your wrestler is registered and paid for.</p><p id="status" role="status" aria-live="polite">Loading…</p><div id="passes"></div></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let passes=[];
function render(){
 const only=new URLSearchParams(location.search).get('wrestler'),list=passes.filter(p=>!only||p.wrestlerId===only);
 $('passes').innerHTML=list.map(p=>`<section class="pass"><div class="brand">SAVAGE WRESTLING ACADEMY</div><h2>${esc(p.name)}</h2><div class="qr">${window.qrSvg(p.code,'Entry pass for '+p.name)}</div><p class="muted">Pass issued ${esc(new Date(p.createdAt).toLocaleDateString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',year:'numeric'}))}</p><button type="button" data-replace="${esc(p.wrestlerId)}">Replace this pass</button><p class="muted" style="font-size:13px">Replace it if a screenshot was shared or a phone was lost. The old pass stops working at once.</p></section>`).join('')||'<p>Add a wrestler in your <a href="/family">family account</a> to get a pass.</p>';
 document.querySelectorAll('[data-replace]').forEach(b=>b.onclick=async()=>{if(!confirm('Replace this pass? The current code stops working immediately.'))return;try{const r=await fetch('/api/passes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'replace',wrestlerId:b.dataset.replace})}),d=await r.json();if(!r.ok)throw Error(d.error||'Could not replace the pass.');passes=d.passes;render();$('status').textContent='New pass ready. The old one no longer works.'}catch(e){$('status').textContent=e.message}});
}
async function load(){try{const r=await fetch('/api/passes',{cache:'no-store'});if(r.status===401){location.href='/login';return}const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load passes.');passes=d.passes;$('status').textContent='';render()}catch(e){$('status').textContent=e.message}}
window.addEventListener('DOMContentLoaded',load);
</script></body></html>
