<!doctype html><html lang="en"><head><script defer src="/navigation.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review and sign | Savage Wrestling Academy</title><link rel="stylesheet" href="/responsive.css"><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f6;color:#18191c;font:16px/1.65 Arial}main{max-width:960px;margin:auto;padding:24px}section,article{background:white;border:1px solid #ddd;border-radius:10px;padding:24px;margin:20px 0}h1,h2{line-height:1.2}a{color:#a92330}label{display:block;font-weight:bold;margin:16px 0}input,select,textarea,button{font:inherit;padding:12px;border:1px solid #ccc;border-radius:6px}input,select,textarea{display:block;width:100%;margin-top:6px}input[type=checkbox]{display:inline;width:auto}button{cursor:pointer;background:white;color:#18191c;min-height:44px}button:disabled{opacity:.55;cursor:default}.primary{background:#d72732;border-color:#d72732;color:white}.muted{font-size:14px;color:#646771}.notice{padding:16px;border-left:4px solid #d72732;background:#fff2f2}.pill{display:inline-block;background:#eee;padding:4px 8px;border-radius:5px;font-size:13px;font-weight:bold}.terms{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:#fafafa;border:1px solid #ddd;border-radius:6px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}[hidden]{display:none!important}#status{font-weight:bold;scroll-margin-top:20px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #227ab0;outline-offset:3px}@media(max-width:600px){main{padding:16px}section,article{padding:18px}.grid{grid-template-columns:1fr}}.signature-canvas{display:block;width:100%;height:auto;aspect-ratio:4/1;border:1px solid #999;border-radius:6px;background:white;touch-action:none}.signature-panel{margin:20px 0;padding:18px;background:#fafafa;border:1px solid #ddd;border-radius:6px}textarea{box-sizing:border-box}button:disabled{cursor:wait}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button[aria-selected=true]{background:#18191c;color:white}.meta{font-size:13px;color:#646771}.stack{display:grid;gap:12px}.record{display:flex;align-items:start;justify-content:space-between;gap:18px}.record h3{margin:0}.record p{margin:8px 0}.record-actions{display:flex;gap:8px;flex-wrap:wrap}.pill.signed{background:#dff3e7;color:#235d3e}.pill.pending{background:#fff0ca;color:#795200}.empty{padding:25px;text-align:center;color:#646771}a.button{display:inline-block;padding:10px 14px;border:1px solid #ccc;border-radius:6px;text-decoration:none}input[readonly]{background:#f5f5f6}.form-status{font-weight:bold;min-height:1.5em}.signature-canvas{touch-action:none}details{margin:16px 0}summary{cursor:pointer;font-weight:bold}@media(max-width:650px){.record{display:block}.record-actions{margin-top:15px}}</style></head><body><main><a href="/family-documents">← Family documents</a><h1 id="heading">Review your document</h1><p id="status" role="status" aria-live="polite">Loading document…</p><section id="signin" hidden><h2>Parent or guardian sign-in</h2><p>Sign in with the family account that received the request.</p><a id="login" href="/login">Sign in / create account →</a> <a id="verify" href="/security">Verify authenticator</a><button id="retry">Reload document</button></section><section id="document" hidden></section></main><script>const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id')||'';let documentRecord=null,signatureStrokes=[],drawing=null;const consent='I consent to use an electronic signature for this agreement and intend my drawn signature to record my acceptance. I can save or print a copy of the signed agreement.';const returnTo=encodeURIComponent('/document-sign?id='+id);$('login').href='/login?next='+returnTo;$('verify').href='/security?next='+returnTo;
async function load(){$('signin').hidden=true;$('document').hidden=true;try{const r=await fetch('/api/family-documents?id='+encodeURIComponent(id),{cache:'no-store'}),d=await r.json();if([401,403,404].includes(r.status))$('signin').hidden=false;if(!r.ok)throw Error(d.error||'Unable to load document.');const a=d.document;documentRecord=a;$('heading').textContent=a.title;$('document').innerHTML=`<p>Wrestler covered: <b>${esc(a.wrestler_name)}</b><br>${esc(a.kind)} · Version ${a.version}</p>${d.canSign?'<p><a href="#signForm">Go to signature and confirmation ↓</a></p>':''}<div class="terms">${esc(a.body)}</div>${a.status==='signed'?`<p class="notice">Signed by ${esc(a.signer)} on ${esc(new Date(a.signed_at).toLocaleDateString('en-US',{timeZone:'America/New_York',dateStyle:'long'}))}.</p><a href="/document-copy?id=${encodeURIComponent(a.id)}" target="_blank" rel="noopener">View / print signed copy</a> · <a href="/document-copy?id=${encodeURIComponent(a.id)}&amp;download=1">Download</a>`:a.status==='void'?'<p>This request was withdrawn. No signature is needed.</p>':!d.canSign?`<p class="notice">Read-only preview. This request belongs to <strong>${esc(a.family_email)}</strong>. The assigned parent or guardian signs from that account.</p><p><a href="/accounts">Open Families to set up your own test waiver</a></p>`:`<form id="signForm"><p>This form is for the wrestler’s parent or legal guardian to sign.</p><label>Parent or legal guardian’s printed full name<input id="signer" maxlength="120" minlength="2" required autocomplete="name"></label><div class="signature-panel"><h2>Sign your name</h2><p>Use your finger, mouse, or stylus in the box.</p><canvas id="signatureCanvas" width="800" height="200" class="signature-canvas" aria-label="Draw your signature here"></canvas><button type="button" id="clearSignature">Clear signature</button><label>Date signed<input id="signatureDate" readonly></label><p class="muted">The actual date and time are recorded automatically in New York time when you submit.</p></div><label><input id="accepted" type="checkbox" required> I have read and accept this document. I am the wrestler’s parent or legal guardian.</label><label><input id="electronicConsent" type="checkbox" required> ${consent}</label><button class="primary" id="sign">Confirm &amp; save signature</button></form>`}`;$('document').hidden=false;$('status').textContent=a.status==='pending'?(d.canSign?'Review the full wording before signing.':'Viewing a pending signature request.'):'Your document record is saved.';if(d.canSign){setupSignature();$('signForm').onsubmit=sign}}catch(e){$('status').textContent=e.message}}
async function sign(e){e.preventDefault();$('sign').disabled=true;try{const r=await fetch('/api/family-documents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,versionId:documentRecord.version_id,bodyHash:documentRecord.body_hash,signer:$('signer').value,signerRole:'guardian',accepted:$('accepted').checked,electronicConsent:$('electronicConsent').checked,signature:{method:'drawn',strokes:signatureStrokes}})}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to sign.');await load()}catch(e){$('status').textContent=e.message;if($('sign'))$('sign').disabled=false}}
function setupSignature(){
 signatureStrokes=[];drawing=null;
 const canvas=$('signatureCanvas'),context=canvas.getContext('2d');let activePointer=null;
 function redraw(){context.clearRect(0,0,canvas.width,canvas.height);context.strokeStyle='#18191c';context.lineWidth=2.5;context.lineCap='round';context.lineJoin='round';for(const stroke of signatureStrokes){if(stroke.length<2)continue;context.beginPath();stroke.forEach(([x,y],i)=>i?context.lineTo(x*canvas.width,y*canvas.height):context.moveTo(x*canvas.width,y*canvas.height));context.stroke()}}
 function point(e){const box=canvas.getBoundingClientRect();return [Math.round(Math.max(0,Math.min(1,(e.clientX-box.left)/box.width))*1000)/1000,Math.round(Math.max(0,Math.min(1,(e.clientY-box.top)/box.height))*1000)/1000]}
 $('signatureDate').value=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',month:'long',day:'numeric',year:'numeric'}).format(new Date());
 $('clearSignature').onclick=()=>{signatureStrokes=[];drawing=null;activePointer=null;redraw()};
 canvas.onpointerdown=e=>{if(e.isPrimary===false||drawing||signatureStrokes.length>=100)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);activePointer=e.pointerId;drawing=[point(e)];signatureStrokes.push(drawing)};
 canvas.onpointermove=e=>{if(!drawing||e.pointerId!==activePointer)return;e.preventDefault();if(signatureStrokes.reduce((n,s)=>n+s.length,0)>=2000)return;const p=point(e),last=drawing[drawing.length-1];if(Math.hypot(p[0]-last[0],p[1]-last[1])<.003)return;drawing.push(p);redraw()};
 canvas.onpointerup=e=>{if(e.pointerId!==activePointer)return;if(drawing?.length<2)signatureStrokes.pop();drawing=null;activePointer=null;redraw()};
 canvas.onpointercancel=e=>{if(e.pointerId!==activePointer)return;if(drawing)signatureStrokes.pop();drawing=null;activePointer=null;redraw()};
}

$('retry').onclick=load;load();</script></body></html>
