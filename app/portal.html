/* Premium pass (issue #153): the same finish as the rest of the site (public/savage.css, issue #146). */
@font-face{font-family:Barlow;src:url(/fonts/barlow-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Barlow;src:url(/fonts/barlow-latin-600-normal.woff2) format('woff2');font-weight:500 600;font-display:swap}
@font-face{font-family:Barlow;src:url(/fonts/barlow-latin-700-normal.woff2) format('woff2');font-weight:700 900;font-display:swap}
@font-face{font-family:'Barlow Condensed';src:url(/fonts/barlow-condensed-latin-700-normal.woff2) format('woff2');font-weight:600 700;font-display:swap}
@font-face{font-family:'Barlow Condensed';src:url(/fonts/barlow-condensed-latin-800-normal.woff2) format('woff2');font-weight:800;font-display:swap}
:root{--red:#C4222C;--ink:#111113;--gray:#55585F;--line:#E4E6EA;--bg:#F3F4F6;--hair:rgba(17,17,19,.08);--shadow:0 1px 2px rgba(17,17,19,.05),0 10px 28px -12px rgba(17,17,19,.16);
}
/* The shared tokens from public/savage.css (issue #227). The Worker gives this page the owner shell but not savage.css
   (issue #261), so these are the same values under the same names, and tests/owner-polish.mjs keeps them identical. */
:root{--swa-prog-advance:#000000;--swa-prog-advance-ink:#FFFFFF;--swa-prog-intermediate:#686868;--swa-prog-intermediate-ink:#FFFFFF;
 --swa-prog-development:#FFFFFF;--swa-prog-development-ink:#18191C;--swa-prog-development-line:#999999;--swa-prog-event:#D72732;--swa-prog-event-ink:#FFFFFF;
 --swa-warn-bg:#FFF7E6;--swa-warn-line:#F0D49C;--swa-warn-ink:#5C3B00}
body{font-family:Barlow,'Helvetica Neue',Arial,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}

h1{font:800 clamp(35px,4vw,42px)/1 'Barlow Condensed',Impact,sans-serif;letter-spacing:-.3px;text-transform:uppercase}
h2{font:700 20px/1.2 Barlow,'Helvetica Neue',Arial,sans-serif;text-transform:none;letter-spacing:-.2px}
@media(min-width:900px){h2{font-size:24px}}
main .card{border:1px solid var(--hair);border-radius:12px;box-shadow:var(--shadow);padding:24px}
/* The title row (issue #280): the heading, one line and the actions, on the ground; the black band is gone */
main .title{margin:0 0 24px;padding:0;align-items:flex-end;flex-wrap:wrap}
main .title h1{margin-bottom:8px}
main .title button,main .title a.button{white-space:nowrap}
main .title p.muted{font-size:17px}
/* Buttons (issue #280): Barlow sentence case, 48px like the fields; only the primary is condensed capitals. The sidebar
   menu, list links and calendar cards keep their own look (calendar cards are read, not pressed like a button, issue #232) */
main button:not(.toollink):not(.tool):not(.event):not(.mobile-practice),main a.button{font-family:Barlow,'Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:17px;letter-spacing:0;text-transform:none;border-radius:8px;min-height:48px;border:1px solid #CDD0D6;box-shadow:0 1px 2px rgba(17,17,19,.06)}
main button.primary,main a.button.primary,main .primary{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:700;font-size:20px;letter-spacing:.8px;text-transform:uppercase;background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 8px 18px -8px rgba(196,34,44,.7)}
main input:not([type=checkbox]):not([type=radio]),main select,main textarea{border:1px solid #CDD0D6;border-radius:8px;background:#FBFBFC;min-height:48px;padding:10px 12px}
main input:focus,main select:focus,main textarea:focus{outline:none;border-color:var(--ink);background:#fff;box-shadow:0 0 0 4px rgba(196,34,44,.16)}
/* Today figures and the daily tiles */
a.tool{border:1px solid var(--hair);border-radius:12px;box-shadow:var(--shadow)}
a.tool.metric>span.muted:first-child{font-size:12px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase}
a.tool.metric>b{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:800;font-size:35px!important;line-height:1;letter-spacing:-.3px;margin:8px 0 4px}
a.tool.metric>span.small{font:500 13px/1.4 Barlow,Arial,sans-serif;letter-spacing:0;text-transform:none}
.tools-card .daily .tool b{font:700 17px/1.2 Barlow,'Helvetica Neue',Arial,sans-serif;text-transform:none;letter-spacing:0}
/* Calendars and date grids (issue #189): today gets a red ring or underline and a "Today" tag (New York date); a holiday is a quiet label. */
.day.is-today,.mobile-calendar-day.is-today{box-shadow:inset 0 0 0 2px var(--red)}.today-mark{text-decoration:underline 2px var(--red);text-underline-offset:4px}
.today-tag{display:inline-block;margin-left:6px;font:700 10px/1 Barlow,Arial,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:var(--red);vertical-align:1px}
.holiday-tag{display:block;margin:4px 0 0;font:600 11px/1.3 Barlow,Arial,sans-serif;color:var(--gray);overflow-wrap:anywhere}.holiday-tag::before{content:"";display:inline-block;width:6px;height:6px;margin-right:5px;border-radius:50%;border:1.5px solid var(--gray);vertical-align:1px}
.mobile-calendar-day .holiday-tag{font-size:13px}.event-times{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
/* Design polish 4 (issue #232). The sidebar, header and Account menu are the owner shell now (issue #261, public/owner-shell.css). */
.title-actions .button{display:inline-flex;align-items:center;justify-content:center}
.title-actions{display:flex;flex:none;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;max-width:100%}
@media(max-width:650px){
 .toolbar select.calendar-month{flex:1 1 0;width:auto;min-width:0}
 main .title{margin-bottom:16px}main .title .eyebrow{margin-bottom:8px!important}
 .title-actions{justify-content:flex-start;gap:8px;margin-top:6px;width:100%}.title-actions>*{flex:1 1 0}.title-actions>.primary{flex-basis:100%}
}
/* The dashboard (issue #283, from the Phase 4 mockup): the date and today's facts in the title row, four tiles, the dark
   "Tonight on the mat" timeline, "Needs you" (the launch checklist's open items live there), "Coming up" and "This month".
   The sidebar is the map; the dashboard no longer repeats it. The dark set and the shape tokens are the savage.css ones. */
:root{--dark-0:#0D0D0F;--dark-1:#17181B;--dark-2:#222327;--dark-line:rgba(255,255,255,.08);--dark-text:#ECEDEF;--dark-muted:#A6A9B0}
.title .sync{margin:6px 0 0;font-size:13px;font-weight:600;color:#27764b}.title .sync.bad{color:#b12c38}.title .sync:empty{display:none}
main .title+.os-tabs{margin-top:-8px}
.dash{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:24px;align-items:start}
.dash .tiles{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.dash-col{display:grid;gap:24px;min-width:0}.dash .card{margin:0}
a.tile{display:block;min-width:0;background:#fff;border:1px solid var(--hair);border-radius:12px;box-shadow:var(--shadow);padding:12px 16px;text-decoration:none;color:var(--ink)}
a.tile:hover{border-color:var(--ink)}
.tile .l{display:block;font:700 12px/1.3 Barlow,Arial,sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:var(--gray)}
.tile .v{display:block;font:800 35px/1 'Barlow Condensed',Impact,sans-serif;letter-spacing:-.3px;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.tile .d{display:block;font-size:13px;color:var(--gray);overflow-wrap:anywhere}
.tile.hot{border-color:rgba(196,34,44,.35)}.tile.hot .v{color:var(--red)}
.card h2.swa-label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 12px;font:700 13px/1.2 Barlow,Arial,sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:var(--gray)}
.card h2.swa-label a{color:var(--ink);font:600 15px/1.3 Barlow,Arial,sans-serif;letter-spacing:0;text-transform:none;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.card h2.swa-label a:hover{color:var(--red);text-decoration-color:var(--red)}
.card.dark{background:linear-gradient(180deg,var(--dark-1),var(--dark-0));color:var(--dark-text);border-color:var(--dark-line);box-shadow:none;position:relative;overflow:hidden}
.card.dark::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(196,34,44,.26),transparent 68%)}
.card.dark>*{position:relative;z-index:1}
.card.dark h2.swa-label{color:var(--dark-muted)}.card.dark h2.swa-label a{color:#fff;text-decoration-color:var(--dark-line)}.card.dark .muted,.card.dark .empty-line{color:var(--dark-muted)}
.tl{list-style:none;margin:0;padding:0}.tl li{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--dark-line)}.tl li:first-child{border-top:0;padding-top:0}

function normalizeMoneyInput(field){if(field.value!==''&&field.checkValidity())field.value=Number(field.value).toFixed(2)}
function teamCodeManager(){const codes=data.teamCodes||[];return `<section class="card" id="team-codes" style="margin-top:24px"><div class="row"><h2>Team codes</h2><button class="primary" onclick="editTeamCode()">+ Create team code</button></div><p>Set a percentage discount for eligible 12-month installment memberships. One discount applies per wrestler; codes do not apply to walk-ins, camps, clinics, events, or private lessons.</p><p class="small muted">Codes save online and apply when a family reviews and pays for an installment membership.</p>${codes.map((c,i)=>`<div class="listitem"><div class="grow"><b>${esc(c.code)} · ${esc(c.name)}</b><p>${c.percent}% off monthly · ${esc(c.programs.map(programName).join(', '))}</p><span class="badge ${c.active?'green':''}">${c.active?'Active':'Inactive'}</span></div><div class="actionbar"><button onclick="editTeamCode(${i})">Edit</button><button onclick="toggleTeamCode(${i})">${c.active?'Deactivate':'Activate'}</button></div></div>`).join('')||'<p class="muted">No team codes yet. Create a code to offer a team discount.</p>'}</section>`}
function editTeamCode(index=-1){const c=data.teamCodes?.[index];modal(`<h2>${c?'Edit':'Create'} team code</h2><form onsubmit="event.preventDefault();saveTeamCode(${index},event.target)"><label>Team name<input name="name" maxlength="80" required value="${esc(c?.name||'')}" placeholder="School or team name"></label><label>Code<input name="code" maxlength="32" minlength="3" pattern="[A-Za-z0-9][A-Za-z0-9-]{2,31}" required value="${esc(c?.code||'')}" autocapitalize="characters" spellcheck="false" placeholder="Choose a unique code"></label><p class="small muted">3–32 letters, numbers, or hyphens. Codes are not case-sensitive.</p><label>Discount (%)<input name="percent" type="number" min="1" max="100" step="1" required value="${c?.percent??10}"></label><fieldset><legend>Eligible programs</legend>${programs.map(p=>`<label><input type="checkbox" name="programs" value="${p.id}" ${!c||c.programs.includes(p.id)?'checked':''}>${esc(p.name)}</label>`).join('')}</fieldset><label><input type="checkbox" name="active" ${!c||c.active?'checked':''}>Active</label><p id="teamCodeError" role="alert"></p><button class="primary full">Save team code</button></form>`)}
function saveTeamCode(index,f){const checked=W.teamCodeFromForm(new FormData(f),data.teamCodes||[],index,programs.map(p=>p.id));if(checked.error){$('#teamCodeError').textContent=checked.error;return}data.teamCodes??=[];if(index>=0)data.teamCodes[index]=checked.value;else data.teamCodes.push(checked.value);save();closeModal();render();toast('Team code queued for online saving. Check the save status above.')}
function toggleTeamCode(index){const c=data.teamCodes?.[index];if(!c||!confirm((c.active?'Deactivate ':'Activate ')+c.code+' for new registration reviews?'))return;c.active=!c.active;save();render();toast(c.active?'Team code activated.':'Team code deactivated.')}
function ownerPrograms(){return title('Owner editing','PROGRAMS & PRICING.','Set program details and prices. Both membership payment options cover 12 months. Saved programs appear on the welcome page and calendar.')+(programsSaved?'':'<section class="card" id="publish-programs" style="margin-bottom:20px;border-top:4px solid var(--red)"><h2>Not on the welcome page yet</h2><p>Families see no programs until you publish them. Publishing saves the three programs below with the names, descriptions and prices shown.</p><button class="primary" onclick="publishPrograms()">Publish the programs</button></section>')+`<div class="grid g3">${programs.map((p,i)=>`<form class="card program-color ${calendarProgramColor(p.id)}" onsubmit="event.preventDefault();saveProgram(${i},event.target)"><h2>${esc(p.name)}</h2><label>Program name<input name="name" required maxlength="100" value="${esc(p.name)}"></label><label>Grade eligibility<input name="grades" readonly maxlength="100" value="${esc(p.grades)}"></label><label>Description<textarea name="description" maxlength="2000" rows="5">${esc(p.description)}</textarea></label><label>Monthly installment ($) × 12 payments<input name="price" type="number" inputmode="decimal" onblur="normalizeMoneyInput(this)" min="0" max="10000" step="0.01" required value="${W.dollarsText(p.priceCents)}"></label><label>Walk-in price per practice ($)<input name="walkInPrice" type="number" inputmode="decimal" onblur="normalizeMoneyInput(this)" min="0" max="10000" step="0.01" value="${p.walkInPriceCents===undefined?'':W.dollarsText(p.walkInPriceCents)}" placeholder="0.00"></label><p><strong>12-month total: ${formatPrice(p.priceCents*12)}</strong></p><p class="small muted">Registration enforces these grade limits using each wrestler’s saved profile. Edit this program’s name and description here. Set practice days and times under Schedules.</p><button class="primary">Save program</button></form>`).join('')}</div><section class="card" style="margin-top:20px"><h2>Membership setup</h2><p><a href="/scholarships">Manage invitation-only scholarship memberships →</a></p><p>Available signup options are a dated walk-in, or 12 monthly installments for a 12-month commitment that stop on their own. A year can’t be paid upfront. The membership ends after the term and a new signup is required to continue.</p><p><a href="/membership-terms" target="_blank" rel="noopener">Review draft cancellation and early-exit terms →</a></p><p>Online payment opens one purchase type at a time on <a href="/payment-setup">Online payment setup</a>, once its terms are decided.</p></section><div class="notice">Saved installment and walk-in prices are the prices families see at registration review and checkout. Blank walk-in prices show as awaiting academy pricing.</div>${teamCodeManager()}`}
function saveProgram(i,f){const checked=W.programFromForm(data.programs[i],Object.fromEntries(new FormData(f)));if(checked.error)return toast(checked.error);data.programs[i]=checked.value;hydratePrograms();save()}
let editingSeason=null;
function editSeason(i){const s=data.seasons[i];editingSeason=i;plannerExcluded=new Set(s.excludedDates||[]);plannerMonth=s.start.slice(0,7);render();const f=$('#semesterForm');for(const key of ['season','start','end','program'])f.elements[key].value=s[key];for(const w of s.weekly){const checkbox=[...f.querySelectorAll('[name="selectedDays"]')].find(x=>x.value===w.day);checkbox.checked=true;togglePracticeDay(checkbox);f.elements['start_'+w.day].value=w.start;f.elements['end_'+w.day].value=w.end}refreshPlanner();f.scrollIntoView({behavior:'smooth'})}
function removeSeason(i){if(!confirm('Remove this semester schedule from the online workspace?'))return;data.seasons.splice(i,1);editingSeason=null;save();render()}
function practiceSlot(p,date){return W.practiceSlot(data.seasons,p.id,date)}

let lastArchiveDay=academyToday();
function refreshArchiveDay(){const today=academyToday();if(today===lastArchiveDay)return;lastArchiveDay=today;if(page==='Camps & events'&&!$('#overlay').innerHTML)render()}
document.addEventListener('visibilitychange',refreshArchiveDay);window.addEventListener('focus',refreshArchiveDay);if(typeof setInterval==='function')setInterval(refreshArchiveDay,60000);
// Start-up: open the section named in the address, then load the saved academy.
page=sectionFromAddress();hydratePrograms();reloadAcademy();

</script></body></html>
