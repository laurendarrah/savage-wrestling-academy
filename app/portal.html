<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | Savage Wrestling Academy</title><style>
/* The owner dashboard and its editors: today, the practice calendar, programs and pricing, schedules, camps and events.
   The look comes from the design system in public/savage.css, which the Worker adds after this sheet (issue #341):
   the tokens, type, buttons, fields, cards, pills, the title row, the empty state, the skeleton and the toast. What
   is here is this page's own layout, written with those tokens. A rule that has to outrank the shared sheet starts
   with "html body". */
*{box-sizing:border-box}body{margin:0}
main{max-width:1180px;margin:0;padding:var(--swa-s-24) var(--swa-s-16) var(--swa-s-48)}
h1,h2,h3,p{margin-top:0}
[hidden]{display:none!important}
footer{padding-top:var(--swa-s-32);color:var(--swa-muted);font-size:var(--swa-t-13)}
/* The title row is the shared one (.swa-title); the save status sits under the intro line (issue #283). */
html body .swa-title__text>p.sync{margin:var(--swa-s-4) 0 0;font-size:var(--swa-t-13);font-weight:600;color:var(--swa-ok)}
html body .swa-title__text>p.sync.bad{color:var(--swa-bad)}.sync:empty{display:none}
html body .swa-title__actions .button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
html body .swa-title+.os-tabs{margin-top:calc(-1 * var(--swa-s-8))}

/* ---------- Pieces every editor shares ---------- */
/* Columns: one on a phone, two or three across on a desk. A form never runs wider than 640px. */
.cols{display:grid;gap:var(--swa-s-24);align-items:start}
@media(min-width:1000px){.cols.two{grid-template-columns:repeat(2,minmax(0,1fr))}.cols.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
html body .cols>.card,html body .cols>form.card{margin:0;min-width:0}
main>.card,main>.cols{margin:0 0 var(--swa-s-24)}
.card>h2{margin:0 0 var(--swa-s-8)}.card>h2+p,.card>.swa-section+p{color:var(--swa-muted);font-size:var(--swa-t-15);margin:0 0 var(--swa-s-16);max-width:62ch}
.form{display:grid;gap:var(--swa-s-16);max-width:640px}
.form>*{margin:0;min-width:0}
.form label,.modal label{display:grid;gap:6px;margin:0}
.form input:not([type=checkbox]):not([type=radio]),.form select,.form textarea{width:100%}
.form textarea{resize:vertical}
html body .form label.check,html body label.check{display:flex;align-items:center;gap:10px;font-weight:600}
label.check input{flex:none;margin:0}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--swa-s-12)}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0;margin:0 0 var(--swa-s-8);font-weight:600;font-size:var(--swa-t-15)}
.hint{margin:0;color:var(--swa-muted);font-size:var(--swa-t-13);line-height:1.45}
.form-error{margin:0;color:var(--swa-bad);font-weight:600;font-size:var(--swa-t-15)}.form-error:empty{display:none}
/* The save button with its result beside it */
.save-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--swa-s-8) var(--swa-s-16)}
.save-note{font-size:var(--swa-t-15);font-weight:600;color:var(--swa-ok)}.save-note.bad{color:var(--swa-bad)}.save-note:empty{display:none}
/* A list inside a card: what it is on the left, its one or two actions on the right */
.items{list-style:none;margin:0;padding:0}
.items>li{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:var(--swa-s-8) var(--swa-s-16);padding:var(--swa-s-12) 0;border-top:1px solid var(--swa-line)}
.items>li:first-child{border-top:0;padding-top:0}.items>li:last-child{padding-bottom:0}
.items .what{flex:1 1 240px;min-width:0;font-size:var(--swa-t-15);line-height:1.5;overflow-wrap:anywhere}
.items .what b{display:block;font-size:var(--swa-t-17)}.items .what p{margin:var(--swa-s-4) 0 0;color:var(--swa-muted)}
.item-actions{display:flex;flex-wrap:wrap;align-items:center;gap:var(--swa-s-8)}
.links{list-style:none;margin:0;padding:0}
.empty-line{margin:0;color:var(--swa-muted);font-size:var(--swa-t-15)}
.notice{margin:var(--swa-s-16) 0;padding:var(--swa-s-12) var(--swa-s-16);background:var(--swa-warn-bg);border:1px solid var(--swa-warn-line);color:var(--swa-warn-ink);font-size:var(--swa-t-15);line-height:1.5}
/* A card that asks for one thing: a red bar down its left edge */
html body .card.flag{border-left:4px solid var(--swa-red)}
/* Dialogs (the event and team code editors, a calendar event's details) */
.modalback{position:fixed;inset:0;z-index:80;display:flex;justify-content:center;align-items:center;padding:var(--swa-s-24);background:rgba(10,10,12,.45)}
.modal{width:100%;max-width:640px;max-height:90vh;overflow:auto;background:var(--swa-surface);border-radius:var(--swa-r-card);padding:var(--swa-s-24);box-shadow:0 30px 80px -30px rgba(0,0,0,.5)}
.modal h2{margin:0 0 var(--swa-s-16)}.modal .form{max-width:none}
html body .modal .close,html body .day-panel .close{float:right;width:44px;min-height:44px;padding:0;margin:calc(-1 * var(--swa-s-8)) calc(-1 * var(--swa-s-8)) 0 var(--swa-s-8);border-color:transparent;background:transparent;box-shadow:none;font-size:var(--swa-t-29);font-weight:400;line-height:1;color:var(--swa-muted)}
html body .modal .close:hover,html body .day-panel .close:hover{color:var(--swa-ink);border-color:var(--swa-line)}
.toast{position:fixed;left:var(--swa-s-16);right:var(--swa-s-16);bottom:var(--swa-s-16);z-index:90;margin:0 auto;max-width:420px;padding:var(--swa-s-12) var(--swa-s-16);border-radius:var(--swa-r-control);background:var(--swa-dark-1);color:var(--swa-dark-text);font-size:var(--swa-t-15);font-weight:600}

/* ---------- The dashboard (issue #283): the date and today's facts in the title row, four tiles, "Tonight on the
   mat", "Needs you" (the launch checklist's open items live there), "Coming up" and "This month". ---------- */
.dash{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--swa-s-24);align-items:start}
.dash .tiles{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--swa-s-12)}
.dash-col{display:grid;gap:var(--swa-s-24);min-width:0}html body .dash .card{margin:0;min-width:0}
html body a.tile{display:block;min-width:0;text-decoration:none}html body a.tile:hover{border-color:var(--swa-ink)}
.tile .l{display:block}
.tile .v{display:block;margin:var(--swa-s-8) 0 var(--swa-s-4);font-family:var(--swa-display);font-weight:800;font-size:var(--swa-t-35);line-height:1;letter-spacing:-.3px;text-transform:none;color:var(--swa-ink);font-variant-numeric:tabular-nums}
.tile .d{display:block;font-size:var(--swa-t-13);font-weight:400;letter-spacing:0;text-transform:none;line-height:1.4;overflow-wrap:anywhere}
html body .tile.hot{border-color:rgba(196,34,44,.35)}.tile.hot .v{color:var(--swa-red)}
.tile.wait .skeleton{width:60%}.tile.wait .skeleton.big{width:40%;height:32px}
.skeleton.facts{display:inline-block;width:min(260px,60vw);vertical-align:middle}
/* A card's label, with a thin rule under it and its one link on the right */
html body[data-swa-page] .dash h2.swa-label{display:flex;justify-content:space-between;align-items:baseline;gap:var(--swa-s-12);margin:0 0 var(--swa-s-12);padding-bottom:var(--swa-s-12);border-bottom:1px solid var(--swa-line)}
.dash h2.swa-label a{font-weight:600;font-size:var(--swa-t-15);letter-spacing:0;text-transform:none;color:var(--swa-ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--swa-line)}
.dash h2.swa-label a:hover{color:var(--swa-red);text-decoration-color:var(--swa-red)}
/* Tonight on the mat: the academy's practice box on the dark card. A thin grey outline, a bar down the left edge
   (red for what is on now or next), the group in bold capitals and its time larger under it. */
html body[data-swa-page] .dash .card.dark h2.swa-label{color:#FFFFFF;border-bottom-color:rgba(255,255,255,.22)}
html body .card.dark h2.swa-label a{color:#FFFFFF;text-decoration-color:rgba(255,255,255,.35)}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:var(--swa-s-8)}
.tl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--swa-s-16);align-items:center;padding:var(--swa-s-12) var(--swa-s-16) var(--swa-s-12) calc(var(--swa-s-16) + 4px);border:1px solid rgba(255,255,255,.22);border-radius:var(--swa-r-control);box-shadow:inset 4px 0 0 var(--swa-dark-3)}
.tl li.next,.tl li.now{box-shadow:inset 4px 0 0 var(--swa-red)}
.tl .w{min-width:0;overflow-wrap:anywhere}
.tl .on{display:block;margin:0 0 var(--swa-s-4);font-weight:700;font-size:var(--swa-t-13);letter-spacing:1.6px;text-transform:uppercase;color:#FF7B82}
.tl .w b{display:block;font-weight:700;font-size:var(--swa-t-13);letter-spacing:1.6px;text-transform:uppercase;line-height:1.3;color:#FFFFFF}
.tl .t{display:block;margin:var(--swa-s-4) 0 0;font-family:var(--swa-display);font-weight:800;font-size:var(--swa-t-29);line-height:1;letter-spacing:.2px;color:#FFFFFF;font-variant-numeric:tabular-nums}
.tl .w small{display:block;margin-top:var(--swa-s-4);color:var(--swa-dark-muted);font-size:var(--swa-t-13);line-height:1.4}
.tl .r{color:var(--swa-dark-muted);font-size:var(--swa-t-15);font-weight:700;white-space:nowrap;text-align:right}
.tl .r b{color:#FFFFFF;font-family:var(--swa-display);font-weight:800;font-size:var(--swa-t-29);line-height:1}
.tl .r small{display:block;margin-top:2px;font-size:var(--swa-t-13);font-weight:400}
html body .card.dark .empty-line{color:var(--swa-dark-muted)}
html body .card.dark a.button.primary{display:flex;align-items:center;justify-content:center;width:100%;margin-top:var(--swa-s-16);text-decoration:none}
/* Needs you: a status dot, what it is with one line about it, and one small button. One line each on a desk. */
.todo{list-style:none;margin:0;padding:0}
.todo li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:var(--swa-s-12);align-items:center;min-height:52px;padding:var(--swa-s-8) 0;border-top:1px solid var(--swa-line)}
.todo li:first-child{border-top:0}
#needsNow:not(:empty)+#launchBody #launchItems li:first-child{border-top:1px solid var(--swa-line)}
.todo .dot{width:10px;height:10px;border-radius:50%;background:var(--swa-red);justify-self:center}
.todo .dot.amber{background:transparent;box-shadow:inset 0 0 0 2.5px #C98A00}
.todo .dot.grey{background:transparent;box-shadow:inset 0 0 0 2px var(--swa-muted-2)}
.todo .dot.ok{width:12px;height:12px;background:none;color:var(--swa-ok);font-size:var(--swa-t-13);font-weight:800;line-height:12px;text-align:center}
.todo .txt{display:flex;align-items:baseline;gap:var(--swa-s-8);min-width:0}
.todo b{flex:0 1 auto;min-width:0;font-size:var(--swa-t-15);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo .d{flex:1 1 0;min-width:0;color:var(--swa-muted);font-size:var(--swa-t-13);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html body .todo .button,html body .todo button,html body .rows .button{display:inline-flex;align-items:center;white-space:nowrap;text-decoration:none}
.todo li.wait{display:block;min-height:0;padding:var(--swa-s-8) 0}
.prog{display:flex;align-items:center;gap:var(--swa-s-12);margin-top:var(--swa-s-8);padding-top:var(--swa-s-12);border-top:1px solid var(--swa-line);font-size:var(--swa-t-13);color:var(--swa-muted)}
.prog .bar{flex:1;height:6px;border-radius:3px;background:var(--swa-line);overflow:hidden}.prog .bar i{display:block;height:100%;background:var(--swa-ink);border-radius:3px}.prog.done .bar i{background:var(--swa-ok)}
html body .ready>summary{color:var(--swa-muted);font-size:var(--swa-t-15)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--swa-s-12);align-items:center;min-height:52px;padding:var(--swa-s-8) 0;border-top:1px solid var(--swa-line);font-size:var(--swa-t-15);line-height:1.35}
.rows li:first-child{border-top:0}.rows small{display:block;color:var(--swa-muted);font-size:var(--swa-t-13)}.rows .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:1000px){
 .dash{grid-template-columns:minmax(0,1fr)}.dash .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile .v{font-size:var(--swa-t-29)}.tile .l{min-height:2.6em}
 /* One column: what needs the owner comes right after tonight */
 .dash-col{display:contents}#tonight{order:1}#launch{order:2}#coming{order:3}#thisMonth{order:4}
 .todo .txt{display:block}.todo b{display:block;white-space:normal}.todo .d{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;white-space:normal}
 html body .todo .button,html body .todo button{min-height:44px}
}

/* ---------- The practice calendar (issue #283), with the family calendar's look (issues #322, #341): the same month
   controls and legend chips, each practice a card with its name and time in the program's color, the chosen day in a
   panel that slides over the edge of the page (a bottom sheet on a phone) so the month never shrinks, and a week
   list that is the phone's default. ---------- */
.cal-head{display:flex;flex-wrap:wrap;gap:var(--swa-s-8) var(--swa-s-16);align-items:center;margin:0 0 var(--swa-s-16)}
.month-nav{display:flex;gap:var(--swa-s-8);align-items:center}.month-nav select{width:auto;min-width:200px}
html body .month-nav button,html body .week-nav button{flex:none;min-width:48px;padding:0}
.view-switch{display:inline-flex;gap:4px;padding:4px;border-radius:10px;background:#E9EBEF;margin:0}main>.view-switch{margin:0 0 var(--swa-s-16)}
html body .view-switch button{min-height:40px;padding:0 var(--swa-s-16);border:0;border-radius:7px;background:transparent;box-shadow:none;font-size:var(--swa-t-15);color:var(--swa-muted)}
html body .view-switch button[aria-pressed=true]{background:var(--swa-surface);color:var(--swa-ink);box-shadow:0 1px 2px rgba(17,17,19,.1)}
html body .cal-head .refresh{margin-left:auto;font-size:var(--swa-t-15)}
.legend{display:flex;flex-wrap:wrap;gap:var(--swa-s-8);margin:0 0 var(--swa-s-16);padding:0;list-style:none}
html body .legend button{display:inline-flex;align-items:center;gap:var(--swa-s-8);min-height:36px;padding:0 var(--swa-s-12);border-radius:var(--swa-r-chip);font-size:var(--swa-t-13);font-weight:600;box-shadow:none}
html body .legend button[aria-pressed=false]{color:var(--swa-muted);background:transparent;border-style:dashed;text-decoration:line-through}
.legend i{display:inline-block;flex:none;width:12px;height:12px;border-radius:3px;background:var(--c,#999)}
.legend button[aria-pressed=false] i{opacity:.35}
.dp-row i{display:block;width:4px;height:40px;border-radius:2px;background:var(--c,#999)}
.cal-elementary{--c:var(--swa-prog-development);--ci:var(--swa-prog-development-ink)}.cal-elementary i{box-shadow:inset 0 0 0 1.5px var(--swa-prog-development-line)}.cal-intermediate{--c:var(--swa-prog-intermediate);--ci:var(--swa-prog-intermediate-ink)}.cal-advanced{--c:var(--swa-prog-advance);--ci:var(--swa-prog-advance-ink)}.cal-special{--c:var(--swa-prog-event)}
.cal-layout{display:block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--swa-line);border:1px solid var(--swa-line);border-radius:var(--swa-r-card);overflow:hidden}
.dayname{background:var(--swa-surface);padding:var(--swa-s-8);min-width:0;font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--swa-muted)}
html body .cal .day{min-width:0;min-height:132px;padding:var(--swa-s-8) 6px;border:0;border-radius:0;box-shadow:none;background:var(--swa-surface);color:var(--swa-ink);font-size:var(--swa-t-15);font-weight:600;line-height:1.2;text-align:left;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:6px;cursor:pointer;transform:none}
html body .cal .day:hover{background:var(--swa-surface-2)}
html body .cal .day.is-open{background:var(--swa-surface-2);box-shadow:inset 0 0 0 2px var(--swa-ink)}
html body .cal .day.is-today{box-shadow:inset 0 0 0 2px var(--swa-red)}
html body .cal .day.is-today.is-open{box-shadow:inset 0 0 0 2px var(--swa-ink),inset 0 0 0 4px var(--swa-red)}
html body .cal .day.blank{background:#FAFAFB;cursor:default}.day .n{display:block;padding:0 2px}
.day .bar{position:relative;display:flex;align-items:flex-start;gap:4px;margin:0;min-height:8px}
.day .bar i{display:block;flex:1;min-width:0;padding:6px 8px;border-radius:6px;background:var(--c);color:var(--ci,#fff);font:400 12px/1.35 var(--swa-body);font-style:normal}
/* The name and the time each take their own line and wrap inside the card: nothing is cut off with "…" */
.day .bar i strong,.day .bar i span,.evbar strong,.evbar span{display:block;overflow-wrap:anywhere}.day .bar i strong,.evbar strong{font-weight:700}
/* A dot in the card's corner when the practice has a plan: green for shared with the coaches, amber for a draft */
.day .bar b{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:#2E9E57;box-shadow:0 0 0 1.5px #FFFFFF}.day .bar b.draft{background:#C98A00}
.day .bar:has(b) i strong{padding-right:10px}
.evbar{display:block;padding:6px 8px;border-radius:6px;background:var(--swa-prog-event);color:var(--swa-prog-event-ink);font:400 12px/1.35 var(--swa-body)}
@media(max-width:760px){.day .bar i{height:6px;padding:0;border-radius:3px}.day .bar i strong,.day .bar i span,.evbar span{display:none}}
@media(max-width:760px){html body .cal .day{min-height:72px;padding:6px 4px;gap:4px}.day .bar b{top:-1px;right:-1px;width:7px;height:7px}.evbar{padding:1px 4px;border-radius:4px}.evbar strong{overflow:hidden;white-space:nowrap}.dayname{padding:var(--swa-s-8) 4px;letter-spacing:.6px}}
/* The chosen day: a panel on the right edge under the header. The month keeps its full width behind it. */
.day-panel{position:fixed;z-index:45;top:64px;right:0;bottom:0;width:min(360px,100vw);overflow:auto;background:var(--swa-surface);border-left:1px solid var(--swa-line);box-shadow:-16px 0 40px -12px rgba(17,17,19,.22);padding:var(--swa-s-24);animation:day-in .18s ease-out}
@keyframes day-in{from{transform:translateX(16px);opacity:0}to{transform:none;opacity:1}}
html body .day-panel h2{margin:0 0 var(--swa-s-8);font-size:var(--swa-t-20);outline:none}
@media(max-width:760px){.cal .day .today-tag{display:none}.cal .day .holiday-tag{width:9px;height:12px;margin:0;overflow:hidden;white-space:nowrap}}.day-panel h2:focus-visible{outline:3px solid var(--swa-red);outline-offset:3px}
.dp-row{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:var(--swa-s-12);align-items:center;padding:var(--swa-s-12) 0;border-top:1px solid var(--swa-line)}.dp-row:first-of-type{border-top:0}
.dp-row b{display:block;font-size:var(--swa-t-17);line-height:1.3;overflow-wrap:anywhere}.dp-row small{display:block;margin-top:2px;color:var(--swa-muted);font-size:var(--swa-t-13);line-height:1.4}.dp-row .plan-state{font-weight:600;color:var(--swa-ink)}
html body .dp-row button{min-height:40px;padding:0 var(--swa-s-12);font-size:var(--swa-t-15);white-space:nowrap}
.event-time{white-space:nowrap}
/* The week: one card a day, the same rows as the day panel. A list, so it keeps a reading width on a desk. */
.week{display:grid;gap:var(--swa-s-12);max-width:760px}
.wk-day{background:var(--swa-surface);border:1px solid var(--swa-hair);border-radius:var(--swa-r-card);box-shadow:var(--swa-shadow);padding:var(--swa-s-16)}
html body .wk-day h3{margin:0;font-size:var(--swa-t-17);display:flex;align-items:center;gap:var(--swa-s-8)}
.wk-day.is-today{box-shadow:inset 0 0 0 2px var(--swa-red)}.wk-day .quiet-line{margin:var(--swa-s-4) 0 0;color:var(--swa-muted);font-size:var(--swa-t-15)}
.wk-day .dp-row:first-of-type{margin-top:var(--swa-s-4)}
.week-nav{display:flex;align-items:center;justify-content:space-between;gap:var(--swa-s-8);max-width:760px;margin:0 0 var(--swa-s-12)}.week-nav strong{flex:1;min-width:0;text-align:center;font-size:var(--swa-t-15)}
html body main>.how{margin:var(--swa-s-16) 0 0}
@media(max-width:900px){

function seasonExceptions(season){if(season.exceptions&&!Array.isArray(season.excludedDates))return '<br><b>Not shown publicly:</b> Edit this semester, select any days off, and save it to publish the dates.<br><b>Old exception notes:</b> '+esc(season.exceptions);if(Array.isArray(season.excludedDates)&&season.excludedDates.length)return '<br><b>No practice:</b> '+season.excludedDates.map(d=>esc(shortDate(d))).join(', ');return season.exceptions?'<br><b>Exceptions:</b> '+esc(season.exceptions):''}
function schedules(){return title('Schedules','Prepare schedules ahead of time.','<button type="button" onclick="startExtraPractice()">+ Add a practice</button>')+`<div class="cols two"><section class="card"><h2>Plan a semester</h2><form id="semesterForm" class="form" onsubmit="event.preventDefault();saveSeason(event.target)"><label>Semester<select name="season"><option>Winter</option><option>Spring</option><option>Summer</option><option>Fall</option></select></label><div class="pair"><label>First practice date<input name="start" type="date" required onchange="refreshPlanner(true)"></label><label>Semester end date<input name="end" type="date" required onchange="refreshPlanner()"></label></div><label>Program<select name="program">${programs.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><fieldset class="practice-days"><legend>Practice days</legend><p class="hint">Select each practice day and set its start and end times.</p>${weekdays.map(day=>`<div class="practice-day"><label class="day-choice"><input type="checkbox" name="selectedDays" value="${day}" onchange="togglePracticeDay(this)"> ${day}</label><div class="day-times" hidden><label>Start time<input aria-label="${day} start time" name="start_${day}" type="time" value="18:00" disabled></label><label>End time<input aria-label="${day} end time" name="end_${day}" type="time" value="19:30" disabled></label></div></div>`).join('')}</fieldset><div class="holiday-planner"><h3>Holiday calendar & days off</h3><input type="hidden" name="exceptions" value="${esc(JSON.stringify([...plannerExcluded].sort()))}"><div id="holidayPlanner">${holidayPlannerMarkup()}</div></div><div class="save-row"><button class="primary">Save semester</button></div></form></section><section class="card"><h2>Prepared semesters</h2><p>Semester schedules and days off publish to the family calendar as soon as they save. A future schedule can be saved before it takes effect. Billing continues year-round.</p>${data.seasons.length?`<ul class="items">${data.seasons.map((s,i)=>`<li><div class="what"><b>${esc([s.season,programName(s.program)].filter(Boolean).join(' · '))}</b><p>${esc(shortDate(s.start,true))} to ${esc(shortDate(s.end,true))}</p><p>${seasonTimes(s)}${seasonExceptions(s)}</p></div><div class="item-actions"><button type="button" class="sm" onclick="editSeason(${i})">Edit</button><button type="button" class="sm quiet" onclick="removeSeason(${i})">Remove</button></div></li>`).join('')}</ul>`:emptyState('No semesters yet. Plan one with the form and its practices appear on the calendar.')}</section></div>${extraPracticeManager()}`}function saveSeason(f){const fd=new FormData(f),checked=W.seasonFromForm(Object.fromEntries(fd),fd);if(checked.error){toast(checked.error);return}if(editingSeason!==null)data.seasons.splice(editingSeason,1);data.seasons.push(checked.value);editingSeason=null;save();plannerExcluded=new Set();plannerMonth='';render();toast('Semester queued for online saving.')}
function normalizeMoneyInput(field){if(field.value!==''&&field.checkValidity())field.value=Number(field.value).toFixed(2)}
function teamCodeManager(){const codes=data.teamCodes||[];return `<section class="card" id="team-codes"><div class="swa-section"><h2>Team codes</h2><button type="button" class="sm" onclick="editTeamCode()">+ Create team code</button></div><p>Set a percentage discount for monthly memberships. One discount applies per wrestler; codes do not apply to walk-ins, camps, clinics, events, or private lessons.</p>${codes.length?`<ul class="items">${codes.map((c,i)=>`<li><div class="what"><b>${esc(c.code)} · ${esc(c.name)}</b><p>${c.percent}% off monthly · ${esc(c.programs.map(programName).join(', '))}</p></div><div class="item-actions"><span class="pill ${c.active?'ok':'neutral'}">${c.active?'Active':'Inactive'}</span><button type="button" class="sm" onclick="editTeamCode(${i})">Edit</button><button type="button" class="sm quiet" onclick="toggleTeamCode(${i})">${c.active?'Deactivate':'Activate'}</button></div></li>`).join('')}</ul>`:emptyState('No team codes yet. Create a code to offer a team discount.','','tag')}<p class="hint">Codes save online and apply when a family reviews and pays for a monthly membership.</p></section>`}
function editTeamCode(index=-1){const c=data.teamCodes?.[index];modal(`<h2>${c?'Edit':'Create'} team code</h2><form class="form" onsubmit="event.preventDefault();saveTeamCode(${index},event.target)"><label>Team name<input name="name" maxlength="80" required value="${esc(c?.name||'')}" placeholder="School or team name"></label><label>Code<input name="code" maxlength="32" minlength="3" pattern="[A-Za-z0-9][A-Za-z0-9-]{2,31}" required value="${esc(c?.code||'')}" autocapitalize="characters" spellcheck="false" placeholder="Choose a unique code"></label><p class="hint">3–32 letters, numbers, or hyphens. Codes are not case-sensitive.</p><label>Discount (%)<input name="percent" type="number" min="1" max="100" step="1" required value="${c?.percent??10}"></label><fieldset><legend>Eligible programs</legend>${programs.map(p=>`<label class="check"><input type="checkbox" name="programs" value="${p.id}" ${!c||c.programs.includes(p.id)?'checked':''}> ${esc(p.name)}</label>`).join('')}</fieldset><label class="check"><input type="checkbox" name="active" ${!c||c.active?'checked':''}> Active</label><p id="teamCodeError" class="form-error" role="alert"></p><div class="save-row"><button class="primary">Save team code</button></div></form>`)}
function saveTeamCode(index,f){const checked=W.teamCodeFromForm(new FormData(f),data.teamCodes||[],index,programs.map(p=>p.id));if(checked.error){$('#teamCodeError').textContent=checked.error;return}data.teamCodes??=[];if(index>=0)data.teamCodes[index]=checked.value;else data.teamCodes.push(checked.value);save();closeModal();render();toast('Team code queued for online saving. Check the save status above.')}
function toggleTeamCode(index){const c=data.teamCodes?.[index];if(!c||!confirm((c.active?'Deactivate ':'Activate ')+c.code+' for new registration reviews?'))return;c.active=!c.active;save();render();toast(c.active?'Team code activated.':'Team code deactivated.')}
// Programs & pricing: one white card a program with its calendar color as a swatch (they were filled grey and black),
// the two prices side by side, and Save with its result beside it. Save turns red once something in the card changed,
// so the page has one red button at a time (issue #341).
function ownerPrograms(){return title('Programs &amp; pricing','Set each program’s details and prices.')+(programsSaved?'':'<section class="card flag" id="publish-programs"><h2>Not on the welcome page yet</h2><p>Families see no programs until you publish them. Publishing saves the three programs below with the names, descriptions and prices shown.</p><button type="button" class="primary" onclick="publishPrograms()">Publish the programs</button></section>')+`<div class="cols three">${programs.map((p,i)=>`<form class="card prog-card ${calendarProgramColor(p.id)}" oninput="programEdited(this)" onsubmit="event.preventDefault();saveProgram(${i},event.target)"><h2><i class="swatch" aria-hidden="true"></i><span>${esc(p.name)}</span></h2><div class="form"><label>Program name<input name="name" required maxlength="100" value="${esc(p.name)}"></label><div class="fixed"><span>Grade eligibility</span><p>${esc(p.grades)}</p><input type="hidden" name="grades" value="${esc(p.grades)}"></div><label>Description<textarea name="description" maxlength="2000" rows="6">${esc(p.description)}</textarea></label><div class="pair"><label>Monthly price ($)<input name="price" type="number" inputmode="decimal" onblur="normalizeMoneyInput(this)" min="0" max="10000" step="0.01" required value="${W.dollarsText(p.priceCents)}"></label><label>Walk-in price ($)<input name="walkInPrice" type="number" inputmode="decimal" onblur="normalizeMoneyInput(this)" min="0" max="10000" step="0.01" value="${p.walkInPriceCents===undefined?'':W.dollarsText(p.walkInPriceCents)}" placeholder="0.00" aria-label="Walk-in price per practice ($)"></label></div><p class="hint">The walk-in price is per practice. Registration enforces these grade limits using each wrestler’s saved profile. Set practice days and times under Schedules.</p><div class="save-row"><button class="save">Save program</button><span class="save-note" role="status" aria-live="polite"></span></div></div></form>`).join('')}</div><div class="cols two"><section class="card"><h2>Membership setup</h2><p>Families choose a dated walk-in or a monthly membership. A membership is month to month with no contract: it renews every month at the program’s monthly price until the family or you cancel it, and a year can’t be paid upfront.</p><p class="hint">Saved programs appear on the welcome page and calendar. Saved monthly and walk-in prices are the prices families see at registration review and checkout; a blank walk-in price shows as awaiting academy pricing. Online payment opens one purchase type at a time on <a href="/payment-setup">Online payment setup</a>, once its terms are decided.</p><ul class="links"><li><a class="swa-link" href="/scholarships">Manage invitation-only scholarship memberships</a></li><li><a class="swa-link" href="/membership-terms" target="_blank" rel="noopener">Review the membership and cancellation terms</a></li></ul></section>${teamCodeManager()}</div>`}
// A program card with something changed in it: its Save button turns red and the last result clears.
function programEdited(f){f.querySelector('.save')?.classList.add('primary');const note=f.querySelector('.save-note');if(note)note.textContent=''}
// Saving a program says so beside its button: "Saving…", then "Saved" or what went wrong (it was only at the top of the page).
function saveProgram(i,f){const note=f.querySelector?.('.save-note'),say=(t,bad=false)=>{if(note){note.textContent=t;note.className='save-note'+(bad?' bad':'')}};const checked=W.programFromForm(data.programs[i],Object.fromEntries(new FormData(f)));if(checked.error){say(checked.error,true);return toast(checked.error)}data.programs[i]=checked.value;hydratePrograms();save();f.querySelector?.('.save')?.classList.remove('primary');const name=f.querySelector?.('h2 span');if(name)name.textContent=programs[i].name;say('Saving…');whenSaved().then(()=>say(saveBlocked?'Not saved. Check the save status under the page title.':'Saved',saveBlocked))}
let editingSeason=null;
function editSeason(i){const s=data.seasons[i];editingSeason=i;plannerExcluded=new Set(s.excludedDates||[]);plannerMonth=s.start.slice(0,7);render();const f=$('#semesterForm');for(const key of ['season','start','end','program'])f.elements[key].value=s[key];for(const w of s.weekly){const checkbox=[...f.querySelectorAll('[name="selectedDays"]')].find(x=>x.value===w.day);checkbox.checked=true;togglePracticeDay(checkbox);f.elements['start_'+w.day].value=w.start;f.elements['end_'+w.day].value=w.end}refreshPlanner();f.scrollIntoView({behavior:'smooth'})}
function removeSeason(i){if(!confirm('Remove this semester schedule from the online workspace?'))return;data.seasons.splice(i,1);editingSeason=null;save();render()}
function practiceSlot(p,date){return W.practiceSlot(data.seasons,p.id,date)}

let lastArchiveDay=academyToday();
function refreshArchiveDay(){const today=academyToday();if(today===lastArchiveDay)return;lastArchiveDay=today;if(page==='Camps & events'&&!$('#overlay').innerHTML)render()}
document.addEventListener('visibilitychange',refreshArchiveDay);window.addEventListener('focus',refreshArchiveDay);if(typeof setInterval==='function')setInterval(refreshArchiveDay,60000);
// Start-up: open the section named in the address, then load the saved academy.
page=sectionFromAddress();hydratePrograms();reloadAcademy();

</script></body></html>
