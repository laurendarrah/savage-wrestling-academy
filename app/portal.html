@font-face{font-family:Barlow;src:url(/fonts/barlow-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Barlow;src:url(/fonts/barlow-latin-600-normal.woff2) format('woff2');font-weight:500 600;font-display:swap}

:root{--red:#C4222C;--ink:#111113;--gray:#55585F;--line:#E4E6EA;--bg:#F3F4F6;--hair:rgba(17,17,19,.08);--shadow:0 1px 2px rgba(17,17,19,.05),0 10px 28px -12px rgba(17,17,19,.16);
 --texture:radial-gradient(90% 140% at 100% 0%,rgba(196,34,44,.22),transparent 60%),repeating-linear-gradient(135deg,rgba(255,255,255,.028) 0 1px,transparent 1px 10px),linear-gradient(180deg,#141416,#0D0D0F)}
body{font-family:Barlow,'Helvetica Neue',Arial,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
aside{background:var(--texture)}
h1{font:800 clamp(38px,5vw,56px)/.98 'Barlow Condensed',Impact,sans-serif;letter-spacing:-.4px;text-transform:uppercase}
h2{font:800 28px/1.05 'Barlow Condensed',Impact,sans-serif;text-transform:uppercase;letter-spacing:.1px}
main .card{border:1px solid var(--hair);border-radius:12px;box-shadow:var(--shadow);padding:28px}
/* The title becomes the black band, edge to edge of the work area */
main .title{margin:-36px -40px 30px;padding:40px 40px 34px;background:var(--texture);color:#fff;border-bottom:2px solid var(--red);position:relative;isolation:isolate;overflow:hidden}
main .title::after{content:"";position:absolute;z-index:-1;right:24px;top:14px;bottom:14px;aspect-ratio:1;background:url(/brand/savage-logo-256.png) center/contain no-repeat;opacity:.09;pointer-events:none}
main .title h1{color:#fff;margin-bottom:12px}
main .title button,main .title a.button{white-space:nowrap}
main .title .muted{color:#C9CED4}
main .title .eyebrow{color:#B9C4C9}
main .title button:not(.primary),main .title a.button:not(.primary){background:transparent;color:#fff;border-color:rgba(255,255,255,.35);box-shadow:none}
main .title button:not(.primary):hover,main .title a.button:not(.primary):hover{border-color:#fff}
/* Buttons: condensed capitals; the sidebar menu and list links keep their own look */
main button:not(.toollink):not(.tool),main a.button{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:700;font-size:16px;letter-spacing:.7px;text-transform:uppercase;border-radius:8px;min-height:44px;border:1px solid #CDD0D6;box-shadow:0 1px 2px rgba(17,17,19,.06)}
main button.primary,main a.button.primary,main .primary{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 8px 18px -8px rgba(196,34,44,.7)}
main input:not([type=checkbox]):not([type=radio]),main select,main textarea{border:1px solid #D3D6DC;border-radius:8px;background:#FBFBFC;min-height:46px;padding:10px 12px}
main input:focus,main select:focus,main textarea:focus{outline:none;border-color:var(--ink);background:#fff;box-shadow:0 0 0 4px rgba(196,34,44,.16)}
/* Today figures and the daily tiles */
a.tool{border:1px solid var(--hair);border-radius:12px;box-shadow:var(--shadow)}
a.tool.metric>span.muted:first-child{font-size:12px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase}
a.tool.metric>b{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:800;font-size:40px!important;line-height:1.05;margin:4px 0 2px}
a.tool.metric>span.small{font:500 13px/1.4 Barlow,Arial,sans-serif;letter-spacing:0;text-transform:none}
.tools-card .daily .tool b{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.2px}
@media(max-width:760px){main .title{margin:-20px -16px 22px;padding:28px 16px 26px}main .title::after{opacity:.06;right:-20px}}
/* Calendars and date grids (issue #189): today gets a red ring or underline and a "Today" tag (New York date); a holiday is a quiet label. */
.day.is-today,.mobile-calendar-day.is-today{box-shadow:inset 0 0 0 2px var(--red)}.today-mark{text-decoration:underline 2px var(--red);text-underline-offset:4px}
.today-tag{display:inline-block;margin-left:6px;font:700 10px/1 Barlow,Arial,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:var(--red);vertical-align:1px}

function namedMonthOptions(key,min='2020-01',max='2100-12'){
 if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(key))return '';
 const [year,month]=key.split('-').map(Number),fmt=new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric',timeZone:'UTC'});
 return Array.from({length:25},(_,i)=>new Date(Date.UTC(year,month-13+i,1))).map(date=>[date.toISOString().slice(0,7),fmt.format(date)]).filter(([value])=>value>=min&&value<=max).map(([value,label])=>'<option value="'+value+'"'+(value===key?' selected':'')+'>'+label+'</option>').join('');
}

let editingExtraPractice=null,extraPracticeDates=new Set(),extraPracticeMonth='';

function extraPracticeDateLabel(d){return new Date(d+'T12:00:00Z').toLocaleDateString('en-US',{timeZone:'UTC',month:'short',day:'numeric',year:'numeric'})}
function extraPracticeCalendar(){const key=extraPracticeMonth||academyToday().slice(0,7),[y,m]=key.split('-').map(Number),count=new Date(Date.UTC(y,m,0)).getUTCDate(),offset=new Date(key+'-01T12:00:00Z').getUTCDay(),today=academyToday();return `<div class="row" style="margin:16px 0"><button type="button" aria-label="Previous practice month" onclick="moveExtraPracticeMonth(-1)">←</button><strong aria-live="polite">${new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(key+'-01T12:00:00Z'))}</strong><button type="button" aria-label="Next practice month" onclick="moveExtraPracticeMonth(1)">→</button></div><div class="extra-practice-grid" role="group" aria-label="Select practice dates">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<span>${d}</span>`).join('')}${Array.from({length:offset},()=>'<span></span>').join('')}${Array.from({length:count},(_,i)=>{const date=key+'-'+String(i+1).padStart(2,'0'),selected=extraPracticeDates.has(date);return `<button type="button" class="${selected?'selected':''}" aria-label="${date===today?'Today, ':''}${extraPracticeDateLabel(date)}" aria-pressed="${selected}" ${date<today?'disabled':''} onclick="toggleExtraPracticeDate('${date}')">${date===today?'<span class="today-mark">'+(i+1)+'</span>':i+1}</button>`}).join('')}</div><p class="small muted" style="margin-top:12px">Select one date or several. Only the dates you select will be offered.</p><div class="actionbar" aria-label="Selected practice dates">${[...extraPracticeDates].sort().map(d=>`<button type="button" aria-label="Remove ${extraPracticeDateLabel(d)}" onclick="toggleExtraPracticeDate('${d}')">${extraPracticeDateLabel(d)} ×</button>`).join('')||'<span class="muted">No dates selected</span>'}</div>`}

const offeringGrades=['K',...Array.from({length:12},(_,i)=>String(i+1))];
function offeringGradeFields(saved=''){
 const [first,last=first]=saved==='All grades'?['K','12']:saved.split(/\s*[–-]\s*/);
 const known=offeringGrades.includes(first)&&offeringGrades.includes(last);
 const options=value=>'<option value="">No grade limit</option>'+offeringGrades.map(g=>`<option value="${g}"${value===g?' selected':''}>${g==='K'?'Kindergarten':'Grade '+g}</option>`).join('');
 return `<fieldset><legend>Grade range (optional)</legend><input type="hidden" name="gradeRange" value="${esc(saved)}"><div class="grid g2"><label>From grade<select name="gradeFrom" onchange="updateOfferingGrades(this)">${options(known?first:'')}</select></label><label>Through grade<select name="gradeThrough" onchange="updateOfferingGrades(this)">${options(known?last:'')}</select></label></div><p class="small muted" aria-live="polite" data-grade-summary>${saved?'Selected: '+esc(saved):'No grade limit'}</p></fieldset>`;
}
function updateOfferingGrades(input){
 const f=input.form.elements,from=f.gradeFrom,through=f.gradeThrough;
 if(!input.value){from.value='';through.value=''}
 else {
  if(!from.value)from.value=input.value;
  if(!through.value)through.value=input.value;
  if(offeringGrades.indexOf(from.value)>offeringGrades.indexOf(through.value)){
   if(input===from)through.value=from.value;else from.value=through.value;
  }
 }
 f.gradeRange.value=!from.value?'':from.value===through.value?from.value:from.value+'–'+through.value;
 input.form.querySelector('[data-grade-summary]').textContent=f.gradeRange.value?'Selected: '+f.gradeRange.value:'No grade limit';
}

function extraPracticeManager(){normalizeFridayLive();const list=data.extraPractices,v=list.find(p=>p.id===editingExtraPractice)||{name:'',start:'18:00',end:'19:00',memberCents:1000,nonMemberCents:2000,enabled:true};return `<section class="card" id="extra-practices" style="margin-top:24px;border-top:4px solid #d72732"><div class="row"><h2>${editingExtraPractice?'Edit practice':'Add a practice'}</h2>${editingExtraPractice?'<button onclick="newExtraPractice()">+ Add a different practice</button>':''}</div><p>Name your practice, select its dates, and set member and non-member prices. Each date is a separate purchase and is not included in monthly memberships.</p><form id="extraPracticeForm" onsubmit="event.preventDefault();saveExtraPractice(event.target)"><label>Practice name<input name="name" maxlength="120" required placeholder="Friday Night Live" value="${esc(v.name)}"></label>${offeringFields(v)}<h3 style="margin-top:20px">Choose practice dates</h3><div id="extraPracticeCalendar">${extraPracticeCalendar()}</div><div class="grid g2"><label>Start time<input type="time" name="start" required value="${esc(v.start)}"></label><label>End time<input type="time" name="end" required value="${esc(v.end)}"></label><label>Member price per practice ($)<input type="number" name="member" min="0" max="10000" step="0.01" required value="${(v.memberCents/100).toFixed(2)}"></label><label>Non-member price per practice ($)<input type="number" name="nonMember" min="0" max="10000" step="0.01" required value="${(v.nonMemberCents/100).toFixed(2)}"></label></div><p class="small muted">Times shown in New York time.</p><label><input type="checkbox" name="enabled" ${v.enabled?'checked':''}> Show this practice to families</label><button class="primary">${editingExtraPractice?'Save practice changes':'Add practice'}</button></form><h3 style="margin-top:28px">Your additional practices</h3>${list.map(p=>`<div class="listitem"><div class="grow"><b>${esc(p.name)}</b>${offeringDetails(p)}<p>${clockTime(p.start)}–${clockTime(p.end)} · ${formatPrice(p.memberCents)} members / ${formatPrice(p.nonMemberCents)} non-members<br>${p.dates.map(extraPracticeDateLabel).map(esc).join(' · ')}${p.enabled?'':'<br>Hidden from families'}</p><button onclick="editExtraPractice('${p.id}')">Edit dates & prices</button> <button onclick="removeExtraPractice('${p.id}')">Remove practice</button></div></div>`).join('')||'<p class="muted">No additional practices yet. Add Friday Night Live by selecting the Fridays you want above.</p>'}<p><a href="/calendar?view=live" target="_blank" rel="noopener">View family calendar →</a></p></section>`}

function editExtraPractice(id){const p=data.extraPractices.find(p=>p.id===id);if(!p)return;editingExtraPractice=id;extraPracticeDates=new Set(p.dates);extraPracticeMonth=[...p.dates].sort().find(d=>d>=academyToday())?.slice(0,7)||academyToday().slice(0,7);render()}
function saveExtraPractice(form){const f=Object.fromEntries(new FormData(form)),memberCents=Math.round(Number(f.member)*100),nonMemberCents=Math.round(Number(f.nonMember)*100),dates=[...extraPracticeDates].sort();if(!f.name.trim()||f.name.length>120||!dates.length||dates.length>366||!f.start||!f.end||f.start>=f.end||[memberCents,nonMemberCents].some(n=>!Number.isInteger(n)||n<0||n>1000000))return toast('Enter a practice name, select dates, and check the times and prices.');const list=data.extraPractices,v={id:editingExtraPractice||crypto.randomUUID(),name:f.name.trim(),gradeRange:(f.gradeRange??'').trim(),description:(f.description??'').trim(),dates,start:f.start,end:f.end,memberCents,nonMemberCents,enabled:f.enabled==='on'},i=list.findIndex(p=>p.id===v.id);if(list.some(p=>p.id!==v.id&&p.enabled&&v.enabled&&p.name===v.name&&p.start===v.start&&p.dates.some(d=>dates.includes(d))))return toast('This practice is already offered on one of those dates. Edit the existing practice.');if(i>=0)list[i]=v;else {if(list.length>=500)return toast('Remove an older practice before adding another.');list.push(v)}save();newExtraPractice()}

const programs=[{id:'Elementary',name:'SWA Development',grades:'Grades K–6',days:[1,3,5],time:'6:00–7:30 PM',short:'Mon, Wed & Fri',color:'el'},{id:'Intermediate',name:'SWA Intermediate',grades:'Grades 7–12',days:[1,3],time:'7:30–9:00 PM',short:'Mon & Wed',color:'mid'},{id:'Advanced',name:'SWA Advance',grades:'Grades 7–12 · Coach approval required',days:[2,4,0],time:'7:30–9:00 PM · Sun 10:00 AM–12:00 PM',short:'Tue, Thu & Sun',color:''}];
// A new academy starts empty. The server requires these keys. Programs come from the defaults above until the owner publishes them.
const seed={kids:[],bookings:[],attendance:{},messages:[],offers:[],settings:{},seasons:[],staff:[]};let data=structuredClone(seed);
let page='Dashboard',month=Number(academyToday().slice(5,7))-1,year=Number(academyToday().slice(0,4)),filter='All programs';
function ensurePortalData(){data.events??=[];data.events.forEach(e=>{e.id??=crypto.randomUUID()})}ensurePortalData();
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let revision=0,cloudReady=false,saving=false,pending=null,saveBlocked=false,programsSaved=false,saveWaiters=[];
async function ownerSignout(){const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout'})});if(r.ok)location.href='/login';else toast('Sign-out could not finish. Try again.')}
// Save times read "Fri, Nov 6 · 2:16 PM" in New York time (issue #127).
function nyWhen(d,timeOnly=false){const t=new Date(d),f=o=>t.toLocaleString('en-US',{timeZone:'America/New_York',...o}).replace(/[\u202f\u00a0]/g,' '),time=f({hour:'numeric',minute:'2-digit'});return timeOnly?time:f({weekday:'short',month:'short',day:'numeric'})+' · '+time}
function syncStatus(text,error=false){const el=$('#syncStatus');el.textContent=text;el.style.color=error?'#b12c38':'#27764b'}
const programBranding={
 Elementary:{name:'SWA Development',grades:'Grades K–6',description:'For new and returning younger wrestlers. Build fundamentals, confidence, and wrestling skills, with practice partners grouped by experience and readiness.'},
 Intermediate:{name:'SWA Intermediate',grades:'Grades 7–12',description:'For beginners and intermediate wrestlers. Build sound technique, purposeful drilling habits, and confidence applying skills in live wrestling.'},

};
function hydratePrograms(){normalizeFridayLive();data.programs??=programs.map(p=>({...p,description:p.id==='Elementary'?'For new and returning younger wrestlers. Build fundamentals, confidence, and wrestling skills, with practice partners grouped by experience and readiness.':p.id==='Intermediate'?'For beginners and intermediate wrestlers. Build sound technique, purposeful drilling habits, and confidence applying skills in live wrestling.':'For experienced wrestlers ready for faster drilling, demanding situations, and competitive live wrestling. All SWA Advance wrestlers require coach approval.',priceCents:20000,walkInPriceCents:4000}));if(!(data.programNamingVersion>=2)){data.programs=data.programs.map(p=>({...p,...programBranding[p.id],priceCents:20000,walkInPriceCents:4000}));data.programNamingVersion=2}programs.splice(0,programs.length,...structuredClone(data.programs))}
async function reloadAcademy(){if((saving||pending||saveBlocked)&&!confirm('Reload the online version? Any unsaved changes on this device will be lost.'))return;cloudReady=false;calendarPlanSummaries={};$('#main').inert=true;syncStatus('Loading saved data…');try{const r=await fetch('/api/academy',{cache:'no-store'});if(!r.ok)throw Error('Owner sign-in required or online saving unavailable.');const body=await r.json();data=body.data||structuredClone(seed);programsSaved=Array.isArray(body.data?.programs)&&body.data.programs.length>0;revision=body.revision;pending=null;saveBlocked=false;hydratePrograms();ensurePortalData();cloudReady=true;syncStatus(body.updatedAt?'Last saved '+nyWhen(body.updatedAt):'Nothing saved yet');render()}catch(e){saveBlocked=true;syncStatus(e.message,true);$('#main').innerHTML='<section class="card"><h2>Owner access required</h2><p>Sign in with your owner account to load your saved academy settings.</p><a href="/login" target="_top">Sign in with email</a> · <a href="/security">Verify authenticator</a><p>Or open Account &amp; tools and choose Refresh saved data to try again.</p></section>'}finally{$('#main').inert=false}}
function save(){if(!cloudReady||saveBlocked){syncStatus('Changes are not saved. Reload the online version before editing.',true);return}pending=JSON.stringify(data);syncStatus('Saving online…');drainSaves()}
async function drainSaves(){if(saving||saveBlocked)return;saving=true;while(pending&&!saveBlocked){const payload=pending;pending=null;try{const r=await fetch('/api/academy',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision,data:JSON.parse(payload)})});const body=await r.json();if(!r.ok)throw Error(body.error||'Online save failed.');revision=body.revision;programsSaved||=Array.isArray(JSON.parse(payload).programs);if(!pending)syncStatus('All changes saved at '+nyWhen(body.updatedAt,true))}catch(e){saveBlocked=true;syncStatus(e.message+' Unsaved changes remain here. Refresh to reload.',true)}}saving=false;saveWaiters.splice(0).forEach(done=>done())}
// Resolves once the save queue has drained (or stopped on an error; check saveBlocked).
function whenSaved(){return saving?new Promise(done=>saveWaiters.push(done)):Promise.resolve()}
// Launch checklist (#147): one owner click publishes the three programs, as shown under Programs & pricing, to the welcome page and calendar.
async function publishPrograms(){
 if(!cloudReady||saveBlocked){toast('Reload the saved academy data, then publish.');return}
 const list=programs.map(p=>'• '+p.name+' ('+p.grades+'): '+formatPrice(p.priceCents)+' a month'+(p.walkInPriceCents==null?'':', '+formatPrice(p.walkInPriceCents)+' walk-in')).join('\n');
 if(!confirm('Publish these programs on the welcome page and calendar?\n\n'+list+'\n\nYou can change names, descriptions and prices any time under Programs & pricing.'))return;
 save();await whenSaved();
 if(saveBlocked)return;
 toast('Programs published. Families now see them on the welcome page and calendar.');
 render();
}
window.addEventListener('beforeunload',e=>{if(saving||pending||saveBlocked){e.preventDefault();e.returnValue=''}});
function toast(t){if(saving||pending)t='Change queued for online saving. Check the save status above.';if(saveBlocked)t='Change is not saved online. Check the save status above.';$('#toast').innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>$('#toast').innerHTML='',4500)}function closeModal(){$('#overlay').innerHTML=''}function modal(html){$('#overlay').innerHTML='<div class="modalback"><section class="modal" role="dialog" aria-modal="true"><button class="close" aria-label="Close" onclick="closeModal()">×</button>'+html+'</section></div>';setTimeout(()=>$('.modal input,.modal select,.modal button:not(.close)')?.focus(),20)}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

function togglePracticeDay(input){const times=input.closest('.practice-day').querySelector('.day-times');times.hidden=!input.checked;times.querySelectorAll('input').forEach(field=>{field.disabled=!input.checked;field.required=input.checked});refreshPlanner()}
function clockLabel(time){const [hour,minute]=time.split(':').map(Number);return `${hour%12||12}:${String(minute).padStart(2,'0')} ${hour<12?'AM':'PM'}`}
function seasonTimes(season){return Array.isArray(season.weekly)?season.weekly.map(slot=>`${esc(slot.day)} · ${esc(clockLabel(slot.start))}–${esc(clockLabel(slot.end))}`).join('<br>'):`${esc(season.days)} · ${esc(season.time)}–${esc(season.until)}`}
let plannerMonth='',plannerExcluded=new Set();
function dateKey(date){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
function federalHolidays(year){
 const entries=[];
 const add=(name,date,fixed=false)=>{entries.push({date:dateKey(date),name});if(fixed&&(date.getDay()===0||date.getDay()===6)){const observed=new Date(date);observed.setDate(date.getDate()+(date.getDay()===6?-1:1));entries.push({date:dateKey(observed),name:name+' (observed)'})}};
 const nth=(month,weekday,n)=>{const d=new Date(year,month,1);d.setDate(1+(weekday-d.getDay()+7)%7+7*(n-1));return d};
 add('New Year’s Day',new Date(year,0,1),true);
 add('Martin Luther King Jr. Day',nth(0,1,3));
 add('Washington’s Birthday',nth(1,1,3));
 const memorial=new Date(year,5,0);memorial.setDate(memorial.getDate()-(memorial.getDay()+6)%7);add('Memorial Day',memorial);
 add('Juneteenth',new Date(year,5,19),true);
 add('Independence Day',new Date(year,6,4),true);
 add('Labor Day',nth(8,1,1));add('Columbus Day',nth(9,1,2));
 add('Veterans Day',new Date(year,10,11),true);add('Thanksgiving Day',nth(10,4,4));add('Christmas Day',new Date(year,11,25),true);
 return entries;
}
function plannerForm(){return document.getElementById('semesterForm')}
function refreshPlanner(resetMonth=false){const form=plannerForm();if(!form)return;const start=form.elements.start.value,end=form.elements.end.value;if(resetMonth&&start)plannerMonth=start.slice(0,7);if(!plannerMonth)plannerMonth=(start||dateKey(new Date())).slice(0,7);if(start&&end&&end>=start)plannerExcluded=new Set([...plannerExcluded].filter(date=>date>=start&&date<=end));document.getElementById('holidayPlanner').innerHTML=holidayPlannerMarkup(start,end);form.elements.exceptions.value=JSON.stringify([...plannerExcluded].sort())}
function visiblePlannerMonth(start=''){return [/^\d{4}-(0[1-9]|1[0-2])$/.test(plannerMonth)?plannerMonth:'',start.slice(0,7),academyToday().slice(0,7)].find(key=>/^\d{4}-(0[1-9]|1[0-2])$/.test(key))}
function movePlannerMonth(offset){const [year,month]=visiblePlannerMonth(plannerForm()?.elements.start.value||'').split('-').map(Number);plannerMonth=dateKey(new Date(year,month-1+offset,1)).slice(0,7);refreshPlanner()}
function toggleExcludedDate(date){const form=plannerForm(),start=form.elements.start.value,end=form.elements.end.value;if(!start||!end||date<start||date>end)return;if(plannerExcluded.has(date))plannerExcluded.delete(date);else plannerExcluded.add(date);refreshPlanner()}
function holidayPlannerMarkup(start='',end=''){
 const key=visiblePlannerMonth(start),[year,month]=key.split('-').map(Number),first=new Date(year,month-1,1),count=new Date(year,month,0).getDate(),offset=(first.getDay()+6)%7,valid=!!(start&&end&&end>=start);
 const holidays=[year-1,year,year+1].flatMap(federalHolidays),today=academyToday(),selected=plannerForm()?Array.from(plannerForm().querySelectorAll('[name=selectedDays]:checked'),i=>i.value):[];
 return `<div class="row holiday-nav"><button type="button" aria-label="Previous month" onclick="movePlannerMonth(-1)">←</button><b aria-live="polite">${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</b><button type="button" aria-label="Next month" onclick="movePlannerMonth(1)">→</button></div><p class="muted small">${valid?'Tap any date in your semester to mark no practice. Tap again to keep it.':'Choose your first practice and semester end dates to select days off.'}</p><div class="holiday-legend"><span>● Holiday</span><span>◦ Practice day</span><span class="holiday-off-key">✓ No practice</span></div><div class="holiday-grid">${['M','T','W','T','F','S','S'].map(day=>`<div class="holiday-weekday" aria-hidden="true">${day}</div>`).join('')}${'<div></div>'.repeat(offset)}${Array.from({length:count},(_,i)=>{const date=new Date(year,month-1,i+1),iso=dateKey(date),names=holidays.filter(h=>h.date===iso).map(h=>h.name),off=plannerExcluded.has(iso),practice=selected.includes(weekdays[(date.getDay()+6)%7]),enabled=valid&&iso>=start&&iso<=end;return `<button type="button" class="holiday-date ${names.length?'is-holiday':''} ${off?'is-excluded':''} ${practice?'is-practice':''}" ${enabled?'':'disabled'} aria-pressed="${off}" aria-label="${iso===today?'Today, ':''}${date.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}${names.length?', '+esc(names.join(', ')):''}${off?', no practice':practice?', practice day':''}" onclick="toggleExcludedDate('${iso}')"><b>${iso===today?'<span class="today-mark">'+(i+1)+'</span>':i+1}${off?' ✓':practice?' ◦':''}</b>${names.map(name=>`<span>${esc(name)}</span>`).join('')}</button>`}).join('')}</div><div class="holiday-month-list">${holidays.filter(h=>h.date.startsWith(key)).sort((a,b)=>a.date.localeCompare(b.date)).map(h=>`<p><b>${Number(h.date.slice(-2))}</b> · ${esc(h.name)}</p>`).join('')||'<p class="muted small">No U.S. federal holidays this month.</p>'}</div><p class="small muted">Actual and observed U.S. federal holidays shown. Days stay scheduled unless you select them. <a href="https://www.opm.gov/policy-data-oversight/pay-leave/federal-holidays/" target="_blank" rel="noopener">Holiday reference</a></p><div aria-live="polite"><b>Selected days off (${plannerExcluded.size})</b><div class="holiday-selections">${[...plannerExcluded].sort().map(date=>`<button type="button" onclick="toggleExcludedDate('${date}')" aria-label="Remove ${date} from days off">${date} ×</button>`).join('')||'<p class="muted small">No days excluded.</p>'}</div></div>`;
}
function seasonExceptions(season){if(season.exceptions&&!Array.isArray(season.excludedDates))return '<br><b>Not shown publicly:</b> Edit this semester, select any days off, and save it to publish the dates.<br><b>Old exception notes:</b> '+esc(season.exceptions);if(Array.isArray(season.excludedDates)&&season.excludedDates.length)return '<br><b>No practice:</b> '+season.excludedDates.map(esc).join(', ');return season.exceptions?'<br><b>Exceptions:</b> '+esc(season.exceptions):''}
function schedules(){return title('Season planning','SET THE SEASON IN MOTION.','Prepare schedules ahead of time. Billing continues year-round.','<button class="primary" onclick="startExtraPractice()">+ Add a practice</button>')+`<div class="grid g2"><div class="card"><h2>Plan a semester</h2><form id="semesterForm" onsubmit="event.preventDefault();saveSeason(event.target)"><label>Semester<select name="season"><option>Winter</option><option>Spring</option><option>Summer</option><option>Fall</option></select></label><div class="grid g2"><label>First practice date<input name="start" type="date" required onchange="refreshPlanner(true)"></label><label>Semester end date<input name="end" type="date" required onchange="refreshPlanner()"></label></div><label>Program<select name="program">${programs.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><fieldset class="practice-days"><legend>Practice days</legend><p class="muted small">Select each practice day and set its start and end times.</p>${weekdays.map(day=>`<div class="practice-day"><label class="day-choice"><input type="checkbox" name="selectedDays" value="${day}" onchange="togglePracticeDay(this)"> ${day}</label><div class="day-times" hidden><label>Start time<input aria-label="${day} start time" name="start_${day}" type="time" value="18:00" disabled></label><label>End time<input aria-label="${day} end time" name="end_${day}" type="time" value="19:30" disabled></label></div></div>`).join('')}</fieldset><section class="holiday-planner"><h3>Holiday calendar & days off</h3><input type="hidden" name="exceptions" value="${esc(JSON.stringify([...plannerExcluded].sort()))}"><div id="holidayPlanner">${holidayPlannerMarkup()}</div></section><button class="primary full">Save semester</button></form></div><div class="card"><h2>Prepared semesters</h2><p class="muted">A future schedule can be visible to families before it takes effect. No second approval step is required.</p>${data.seasons.map(s=>`<div class="listitem"><div><b>${esc(s.season)} · ${esc(programName(s.program))}</b><p>${esc(s.start)} through ${esc(s.end)}<br>${seasonTimes(s)}${seasonExceptions(s)}</p><span class="badge">Calendar schedule</span><button onclick="editSeason(${data.seasons.indexOf(s)})">Edit</button><button onclick="removeSeason(${data.seasons.indexOf(s)})">Remove</button></div></div>`).join('')||'<div class="empty">Your next semester starts here.</div>'}<div class="notice">Semester schedules and days off save online and publish to the family calendar.</div></div></div>${extraPracticeManager()}`}function saveSeason(f){const fd=new FormData(f),v=Object.fromEntries(fd),days=fd.getAll('selectedDays');if(!days.length){toast('Select at least one practice day.');return}if(v.end<v.start){toast('Semester end date must follow the first practice date.');return}const weekly=days.map(day=>({day,start:fd.get('start_'+day),end:fd.get('end_'+day)}));for(const slot of weekly){if(!slot.start||!slot.end||slot.end<=slot.start){toast(slot.day+': end time must follow start time.');return}}if(editingSeason!==null)data.seasons.splice(editingSeason,1);data.seasons.push({season:v.season,start:v.start,end:v.end,program:v.program,excludedDates:JSON.parse(v.exceptions||'[]').filter(date=>date>=v.start&&date<=v.end),weekly});editingSeason=null;save();plannerExcluded=new Set();plannerMonth='';render();toast('Semester queued for online saving.')}
function formatDollars(dollars){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(dollars))}
function normalizeMoneyInput(field){if(field.value!==''&&field.checkValidity())field.value=Number(field.value).toFixed(2)}
function formatPrice(cents){return formatDollars((cents??20000)/100)}
function downloadWorkspace(){location.href='/backups'}
function teamCodeManager(){const codes=data.teamCodes||[];return `<section class="card" id="team-codes" style="margin-top:24px"><div class="row"><h2>Team codes</h2><button class="primary" onclick="editTeamCode()">+ Create team code</button></div><p>Set a percentage discount for eligible 12-month installment memberships. One discount applies per wrestler; codes do not apply to annual upfront payments, walk-ins, camps, clinics, events, or private lessons.</p><p class="small muted">Codes save online and apply when a family reviews and pays for an installment membership.</p>${codes.map((c,i)=>`<div class="listitem"><div class="grow"><b>${esc(c.code)} · ${esc(c.name)}</b><p>${c.percent}% off monthly · ${esc(c.programs.map(programName).join(', '))}</p><span class="badge ${c.active?'green':''}">${c.active?'Active':'Inactive'}</span></div><div class="actionbar"><button onclick="editTeamCode(${i})">Edit</button><button onclick="toggleTeamCode(${i})">${c.active?'Deactivate':'Activate'}</button></div></div>`).join('')||'<p class="muted">No team codes yet. Create a code to offer a team discount.</p>'}</section>`}
function editTeamCode(index=-1){const c=data.teamCodes?.[index];modal(`<h2>${c?'Edit':'Create'} team code</h2><form onsubmit="event.preventDefault();saveTeamCode(${index},event.target)"><label>Team name<input name="name" maxlength="80" required value="${esc(c?.name||'')}" placeholder="School or team name"></label><label>Code<input name="code" maxlength="32" minlength="3" pattern="[A-Za-z0-9][A-Za-z0-9-]{2,31}" required value="${esc(c?.code||'')}" autocapitalize="characters" spellcheck="false" placeholder="Choose a unique code"></label><p class="small muted">3–32 letters, numbers, or hyphens. Codes are not case-sensitive.</p><label>Discount (%)<input name="percent" type="number" min="1" max="100" step="1" required value="${c?.percent??10}"></label><fieldset><legend>Eligible programs</legend>${programs.map(p=>`<label><input type="checkbox" name="programs" value="${p.id}" ${!c||c.programs.includes(p.id)?'checked':''}>${esc(p.name)}</label>`).join('')}</fieldset><label><input type="checkbox" name="active" ${!c||c.active?'checked':''}>Active</label><p id="teamCodeError" role="alert"></p><button class="primary full">Save team code</button></form>`)}
function saveTeamCode(index,f){const fd=new FormData(f),name=String(fd.get('name')||'').trim(),code=String(fd.get('code')||'').trim().toUpperCase(),percent=Number(fd.get('percent')),eligible=fd.getAll('programs').map(String),codes=data.teamCodes||[];if(!name||name.length>80||! /^[A-Z0-9][A-Z0-9-]{2,31}$/.test(code)||!Number.isInteger(percent)||percent<1||percent>100||!eligible.length||eligible.some(id=>!programs.some(p=>p.id===id))||codes.some((c,i)=>i!==index&&c.code===code)||index<0&&codes.length>=200){$('#teamCodeError').textContent='Enter a unique code, team name, 1–100% discount, and at least one eligible program.';return}const entry={id:codes[index]?.id||crypto.randomUUID(),name,code,percent,programs:eligible,active:fd.get('active')==='on'};data.teamCodes??=[];if(index>=0)data.teamCodes[index]=entry;else data.teamCodes.push(entry);save();closeModal();render();toast('Team code queued for online saving. Check the save status above.')}
function toggleTeamCode(index){const c=data.teamCodes?.[index];if(!c||!confirm((c.active?'Deactivate ':'Activate ')+c.code+' for new registration reviews?'))return;c.active=!c.active;save();render();toast(c.active?'Team code activated.':'Team code deactivated.')}
function ownerPrograms(){return title('Owner editing','PROGRAMS & PRICING.','Set program details and prices. Both membership payment options cover 12 months. Saved programs appear on the welcome page and calendar.')+(programsSaved?'':'<section class="card" id="publish-programs" style="margin-bottom:20px;border-top:4px solid var(--red)"><h2>Not on the welcome page yet</h2><p>Families see no programs until you publish them. Publishing saves the three programs below with the names, descriptions and prices shown.</p><button class="primary" onclick="publishPrograms()">Publish the programs</button></section>')+`<div class="grid g3">${programs.map((p,i)=>`<form class="card program-color ${calendarProgramColor(p.id)}" onsubmit="event.preventDefault();saveProgram(${i},event.target)"><h2>${esc(p.name)}</h2><label>Program name<input name="name" required maxlength="100" value="${esc(p.name)}"></label><label>Grade eligibility<input name="grades" readonly maxlength="100" value="${esc(p.grades)}"></label><label>Description<textarea name="description" maxlength="2000" rows="5">${esc(p.description)}</textarea></label><label>Monthly installment ($) × 12 payments<input name="price" type="number" inputmode="decimal" onblur="normalizeMoneyInput(this)" min="0" max="10000" step="0.01" required value="${(p.priceCents/100).toFixed(2)}"></label><label>Walk-in price per practice ($)<input name="walkInPrice" type="number" inputmode="decimal" onblur="normalizeMoneyInput(this)" min="0" max="10000" step="0.01" value="${p.walkInPriceCents===undefined?'':(p.walkInPriceCents/100).toFixed(2)}" placeholder="0.00"></label><p><strong>12-month total / upfront price: ${formatPrice(p.priceCents*12)}</strong></p><p class="small muted">Registration enforces these grade limits using each wrestler’s saved profile. Edit this program’s name and description here. Set practice days and times under Schedules.</p><button class="primary">Save program</button></form>`).join('')}</div><section class="card" style="margin-top:20px"><h2>Membership setup</h2><p><a href="/scholarships">Manage invitation-only scholarship memberships →</a></p><p>Available signup options are a dated walk-in, 12 monthly installments for a 12-month commitment, or 12 months paid upfront. Both membership options end after the term and require a new signup to continue. Upfront pricing equals 12 installments before any eligible team discount.</p><p><a href="/membership-terms" target="_blank" rel="noopener">Review draft cancellation and early-exit terms →</a></p><p>Online payment opens one purchase type at a time on <a href="/payment-setup">Online payment setup</a>, once its terms are decided.</p></section><div class="notice">Saved installment, upfront, and walk-in prices are the prices families see at registration review and checkout. Blank walk-in prices show as awaiting academy pricing.</div>${teamCodeManager()}`}
function saveProgram(i,f){const v=Object.fromEntries(new FormData(f)),priceCents=Math.round(Number(v.price)*100);if(!v.name.trim()||!Number.isFinite(priceCents)||priceCents<0||priceCents>1000000)return toast('Enter a valid name and price.');const walkInPriceCents=v.walkInPrice===''?undefined:Math.round(Number(v.walkInPrice)*100);if(walkInPriceCents!==undefined&&(!Number.isFinite(walkInPriceCents)||walkInPriceCents<0||walkInPriceCents>1000000))return toast('Enter a valid walk-in price.');data.programs[i]={...data.programs[i],walkInPriceCents,name:v.name.trim(),grades:v.grades.trim(),description:v.description.trim(),priceCents};hydratePrograms();save()}
let editingSeason=null;
function editSeason(i){const s=data.seasons[i];editingSeason=i;plannerExcluded=new Set(s.excludedDates||[]);plannerMonth=s.start.slice(0,7);render();const f=$('#semesterForm');for(const key of ['season','start','end','program'])f.elements[key].value=s[key];for(const w of s.weekly){const checkbox=[...f.querySelectorAll('[name="selectedDays"]')].find(x=>x.value===w.day);checkbox.checked=true;togglePracticeDay(checkbox);f.elements['start_'+w.day].value=w.start;f.elements['end_'+w.day].value=w.end}refreshPlanner();f.scrollIntoView({behavior:'smooth'})}
function removeSeason(i){if(!confirm('Remove this semester schedule from the online workspace?'))return;data.seasons.splice(i,1);editingSeason=null;save();render()}
function practiceSlot(p,date){const s=[...data.seasons].reverse().find(s=>s.program===p.id&&date>=s.start&&date<=s.end),day=new Date(date+'T12:00:00').getDay();if(s){if((s.excludedDates||[]).includes(date))return null;const w=s.weekly.find(w=>w.day===['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][day]);if(!w)return null;return {label:clockTime(w.start)+'–'+clockTime(w.end)}}return null}
function clockTime(t){const [h,m]=t.split(':').map(Number);return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`}

let lastArchiveDay=academyToday();
function refreshArchiveDay(){const today=academyToday();if(today===lastArchiveDay)return;lastArchiveDay=today;if(page==='Camps & events'&&!$('#overlay').innerHTML)render()}
document.addEventListener('visibilitychange',refreshArchiveDay);window.addEventListener('focus',refreshArchiveDay);if(typeof setInterval==='function')setInterval(refreshArchiveDay,60000);
// Start-up: open the section named in the address, then load the saved academy.
if(location.hash==='#schedules')page='Schedules';if(location.hash.startsWith('#practice-calendar')){page='Calendar';const selectedMonth=new URLSearchParams(location.hash.split('?')[1]||'').get('month')||academyToday().slice(0,7);if(/^\d{4}-(0[1-9]|1[0-2])$/.test(selectedMonth)){year=Number(selectedMonth.slice(0,4));month=Number(selectedMonth.slice(5))-1}}hydratePrograms();reloadAcademy();

</script></body></html>
