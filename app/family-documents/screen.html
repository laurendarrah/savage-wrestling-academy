<!doctype html><html lang="en"><head><script defer src="/navigation.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family documents | Savage Wrestling Academy</title><link rel="stylesheet" href="/responsive.css"><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f6;color:#18191c;font:16px/1.65 Arial}main{max-width:960px;margin:auto;padding:24px}section,article{background:white;border:1px solid #ddd;border-radius:10px;padding:24px;margin:20px 0}h1,h2{line-height:1.2}a{color:#a92330}label{display:block;font-weight:bold;margin:16px 0}input,select,textarea,button{font:inherit;padding:12px;border:1px solid #ccc;border-radius:6px}input,select,textarea{display:block;width:100%;margin-top:6px}input[type=checkbox]{display:inline;width:auto}button{cursor:pointer;background:white;color:#18191c;min-height:44px}button:disabled{opacity:.55;cursor:default}.primary{background:#d72732;border-color:#d72732;color:white}.muted{font-size:14px;color:#646771}.notice{padding:16px;border-left:4px solid #d72732;background:#fff2f2}.pill{display:inline-block;background:#eee;padding:4px 8px;border-radius:5px;font-size:13px;font-weight:bold}.terms{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:#fafafa;border:1px solid #ddd;border-radius:6px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}[hidden]{display:none!important}#status{font-weight:bold;scroll-margin-top:20px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #227ab0;outline-offset:3px}@media(max-width:600px){main{padding:16px}section,article{padding:18px}.grid{grid-template-columns:1fr}}.signature-canvas{display:block;width:100%;height:auto;aspect-ratio:4/1;border:1px solid #999;border-radius:6px;background:white;touch-action:none}.signature-panel{margin:20px 0;padding:18px;background:#fafafa;border:1px solid #ddd;border-radius:6px}textarea{box-sizing:border-box}button:disabled{cursor:wait}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button[aria-selected=true]{background:#18191c;color:white}.meta{font-size:13px;color:#646771}.stack{display:grid;gap:12px}.record{display:flex;align-items:start;justify-content:space-between;gap:18px}.record h3{margin:0}.record p{margin:8px 0}.record-actions{display:flex;gap:8px;flex-wrap:wrap}.pill.signed{background:#dff3e7;color:#235d3e}.pill.pending{background:#fff0ca;color:#795200}.empty{padding:25px;text-align:center;color:#646771}a.button{display:inline-block;padding:10px 14px;border:1px solid #ccc;border-radius:6px;text-decoration:none}input[readonly]{background:#f5f5f6}.form-status{font-weight:bold;min-height:1.5em}.signature-canvas{touch-action:none}details{margin:16px 0}summary{cursor:pointer;font-weight:bold}@media(max-width:650px){.record{display:block}.record-actions{margin-top:15px}}</style></head><body><main><a href="/family">← My family account</a><p class="muted">SAVAGE WRESTLING ACADEMY</p><h1>Your waivers &amp; contracts</h1><p>Review documents that need your signature and open your saved signed copies.</p><p id="status" role="status" aria-live="polite">Loading documents…</p><section><h2>Family documents</h2><div id="documents" class="stack"></div><div class="row"><button id="previous" disabled>Previous</button><span id="pageLabel"></span><button id="next" disabled>Next</button></div></section><section><h2>Signed scholarship agreements</h2><div id="scholarships"></div></section></main><script>const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let offset=0;const date=v=>new Date(v).toLocaleDateString('en-US',{timeZone:'America/New_York',dateStyle:'long'});async function load(){try{const r=await fetch('/api/family-documents?offset='+offset,{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load your documents.');$('documents').innerHTML=d.documents.map(a=>`<article><h3>${esc(a.title)} · v${a.version}</h3><p>${esc(a.wrestler_name)}</p><span class="pill ${esc(a.status)}">${a.status==='signed'?'Signed':a.status==='pending'?'Needs your signature':'Withdrawn'}</span>${a.signed_at?`<p>Printed name · ${esc(a.signer)}<br>Signed ${esc(date(a.signed_at))}</p><a href="/document-copy?id=${encodeURIComponent(a.id)}" target="_blank" rel="noopener">View / print signed copy</a> · <a href="/document-copy?id=${encodeURIComponent(a.id)}&amp;download=1">Download</a>`:a.status==='pending'?`<p><a class="button" href="/document-sign?id=${encodeURIComponent(a.id)}">Review & sign</a></p>`:'<p>This request no longer needs a signature.</p>'}</article>`).join('')||'<p>No documents have been assigned to your family on this page.</p>';$('scholarships').innerHTML=d.scholarships.map(a=>`<article><h3>${esc(a.wrestler_name)}</h3><p>Printed name · ${esc(a.signer)}<br>Signed ${esc(date(a.accepted_at))}</p><a href="/scholarship-agreement?id=${encodeURIComponent(a.id)}" target="_blank" rel="noopener">View / print signed agreement</a> · <a href="/scholarship-agreement?id=${encodeURIComponent(a.id)}&amp;download=1">Download</a></article>`).join('')||'<p>No signed scholarship agreements.</p>';$('previous').disabled=offset===0;$('next').disabled=!d.hasMore;$('pageLabel').textContent='Page '+(offset/50+1);$('status').textContent='Documents are private to your family and the academy owner.'}catch(e){$('status').textContent=e.message}}$('previous').onclick=()=>{offset=Math.max(0,offset-50);load()};$('next').onclick=()=>{offset+=50;load()};load();</script></body></html>
