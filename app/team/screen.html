<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><!--slot:head--><link rel="stylesheet" href="/responsive.css"><style>
/* The team page (issue #196): coaches, wrestler achievements and alumni, filled in by lib/website.ts. Names only, no photos.
   Design pass (issue #340), after the academy's own posts: each section title has a thin rule under it and its line
   above is grey letter-spaced caps (red stays for the one button and the bars); the page's column lines up with the
   hero's; the season band reaches the card's edges; fonts and ink come from the shared tokens. */
body{margin:0;background:var(--swa-ground);color:var(--swa-ink)}
.hero{position:relative;isolation:isolate;overflow:hidden;color:#fff;padding:44px 16px 48px;border-bottom:2px solid var(--swa-red)}
.hero::after{content:"";position:absolute;z-index:-1;right:-30px;top:12px;bottom:12px;aspect-ratio:1;max-width:46vw;background:url(/brand/savage-logo-256.png) center/contain no-repeat;opacity:.08;pointer-events:none}
.hero .in,main{max-width:var(--swa-width-wide);margin:0 auto}
main{max-width:calc(var(--swa-width-wide) + 32px)}
html body .hero .eyebrow{color:var(--swa-silver);margin:0}
html body .hero h1{margin:8px 0 12px;color:#fff;font-size:clamp(44px,9vw,80px)}
.hero .lede{margin:0;color:#D7DBE0;font-size:19px;max-width:52ch}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
html body .jump a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1px solid rgba(255,255,255,.35);border-radius:var(--swa-r-chip);color:#fff;text-decoration:none;font-family:var(--swa-display);font-weight:700;font-size:var(--swa-t-17);letter-spacing:.7px;text-transform:uppercase}
html body .jump a:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,.06)}
main{padding:40px 16px 56px;display:flex;flex-direction:column;gap:48px}
.block{display:flex;flex-direction:column;gap:18px;scroll-margin-top:76px}
.block__head{padding-bottom:var(--swa-s-8);border-bottom:1px solid #D5D8DD}
.block__head .eyebrow{color:var(--swa-muted);margin:0 0 4px}
html body .block h2{margin:0}
/* Coaches: initials, name, specialties, bio. The card's own styles come from lib/website.ts (COACH_CARD_CSS), shared
   with the coach profile page's preview. */
.coaches{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
<!--slot:coachcss-->
/* Achievements, grouped by season */
.seasons{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;align-items:start}
html body main .season{padding:0;overflow:hidden}
html body .season__label{margin:0;padding:14px 20px;background:var(--swa-ink);color:#fff;font-family:var(--swa-display);font-weight:800;font-size:var(--swa-t-24);letter-spacing:.4px;text-transform:uppercase;border-bottom:2px solid var(--swa-red);overflow-wrap:anywhere}
.results{list-style:none;margin:0;padding:0}
.results li{display:flex;flex-direction:column;gap:2px;padding:14px 20px;border-top:1px solid var(--swa-line);overflow-wrap:anywhere}
.results li:first-child{border-top:0}
.results b{font-size:var(--swa-t-17)}
.results span{color:var(--swa-muted);font-size:var(--swa-t-15)}
/* Alumni */
.alumni{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.alum{padding:20px 22px;display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--swa-silver)!important}
html body .alum h3{margin:0;font-size:20px;overflow-wrap:anywhere}
.alum__years{margin:0;align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--swa-muted)}
.alum__next{margin:0;overflow-wrap:anywhere}
.soon{margin:0;font-size:19px}
/* Join band and visit details */
html body main>section.cta{background:var(--swa-texture);color:#fff;border:0;border-bottom:2px solid var(--swa-red);padding:clamp(24px,4vw,40px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 32px;align-items:center}
html body .cta .eyebrow{color:var(--swa-silver);margin:0 0 6px}
html body .cta h2{color:#fff;margin:0 0 8px}
.cta p{margin:0;color:#C9CED4}
.actions{display:flex;flex-wrap:wrap;gap:12px}
html body .actions a.button{min-height:50px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-size:17px;font-weight:700}
html body .cta .actions a.button:not(.primary){background:transparent;border-color:#fff;color:#fff}
html body .cta .actions a.button:not(.primary):hover{background:#26272C}
.visit{display:flex;flex-direction:column;gap:16px}
.visit__card{padding:18px 22px;display:flex;flex-wrap:wrap;gap:12px 40px}
.visit__line{margin:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.visit__label{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--swa-muted)}
footer{color:var(--swa-muted);font-size:15px;text-align:center;padding:0 16px 32px}
@media (max-width:640px){.hero{padding:30px 16px 34px}.coaches,.seasons,.alumni{grid-template-columns:1fr}html body main>section.cta{grid-template-columns:1fr}.actions a.button{flex:1 1 auto}}
</style></head><body>
<div class="hero"><div class="in">
<p class="eyebrow">Savage Wrestling Academy</p>
<h1>The team</h1>
<p class="lede"><!--slot:lede--></p>
<!--slot:jump-->
</div></div>
<main>
<!--slot:sections-->
<section class="cta" aria-labelledby="ctaTitle"><div><p class="eyebrow">Train with us</p><h2 id="ctaTitle">Join the academy</h2><p>Programs for kindergarten through 12th grade. See the weekly times, then sign up online.</p></div><div class="actions"><a class="button primary" href="/login?mode=signup">Join the academy</a><a class="button" href="/welcome#programsTitle">See the programs</a></div></section>
<!--slot:visit-->
</main>
<footer>Savage Wrestling Academy · Huntington Station, NY · <a href="/welcome">Home</a> · <a href="/calendar">Calendar</a> · <a href="/login">Sign in</a></footer>
</body></html>
