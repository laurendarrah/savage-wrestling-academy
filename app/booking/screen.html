<!doctype html><html lang="en"><head><script defer src="/navigation.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review booking | Savage Wrestling Academy</title><link rel="stylesheet" href="/responsive.css"><style>body{font:16px/1.7 Arial;background:#f5f4f1;color:#18191c;margin:0}main{max-width:760px;margin:auto;padding:25px}section{background:white;border:1px solid #ddd;border-radius:8px;padding:25px;margin:20px 0}input,select,button{font:inherit;padding:12px;min-height:44px;border:1px solid #bbb;border-radius:6px}select{display:block;width:100%;margin:10px 0 20px}button{cursor:pointer;background:#d72732;color:white}a{color:inherit}.notice{background:#fff0f0;border-left:4px solid #d72732;padding:16px}#status{font-weight:bold}[hidden]{display:none!important}</style></head><body><main><a href="/calendar" target="_top">← Calendar & registration</a><h1 id="heading">Review your selection</h1><p id="status" role="status" aria-live="polite">Loading…</p><section id="choice" hidden><h2 id="title"></h2><p id="description"></p><p id="selectedOpening" hidden></p><p id="gradeRange" hidden></p><p id="offeringDescription" style="white-space:pre-wrap;overflow-wrap:anywhere" hidden></p><form id="form"><label>Wrestler<select id="wrestler" required></select></label><label id="optionLabel" hidden>Registration option<select id="option"></select></label><button id="submit">Review selection →</button></form></section><section id="empty" hidden><h2>Add your wrestler first</h2><p><a href="/family" target="_blank" rel="noopener">Open My family in a new tab</a>, save your wrestler, then return and reload this page.</p><button onclick="location.reload()">Reload saved profile</button></section><section id="review" hidden tabindex="-1"><h2>Review only — not booked</h2><div id="details"></div><p class="notice" id="notice"></p><button disabled>Checkout coming soon</button><p><a href="/calendar">Return to calendar & registration</a> · <a href="/family">My family</a></p></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),params=new URLSearchParams(location.search);let family,catalog,selected,busy=false;const clock=t=>{const [h,m]=t.split(':').map(Number);return (h%12||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'AM':'PM')};const money=c=>c===null?'Price to be confirmed':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(c/100);async function call(url,body){const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load.');return d}
function eventDay(event,day){
 const label=new Date(day+'T12:00:00Z').toLocaleDateString('en-US',{timeZone:'UTC',month:'short',day:'numeric',year:'numeric'});
 const session=event.schedule?.find(slot=>slot.date===day);
 return label+(session?' · '+clock(session.start)+'–'+clock(session.end)+' ET':'');
}
async function load(){try{[family,catalog]=await Promise.all([call('/api/family'),call('/api/public-schedule'+(params.get('type')==='live'&&/^\d{4}-\d{2}-\d{2}$/.test(params.get('date')||'')?'?month='+params.get('date').slice(0,7):''))]);const lesson=params.get('type')==='lesson',live=params.get('type')==='live';selected=live?(catalog.liveClasses||[]).find(c=>c.date===params.get('date')&&c.id===params.get('id')):lesson?catalog.privateFormats.find(p=>p.id===params.get('format')):catalog.events.find(e=>e.id===params.get('id'));if(!selected)throw Error('This offering is no longer available. Return to the calendar.');$('heading').textContent=live?'Practice registration':lesson?'Private lesson inquiry':'Camp / clinic / event registration';$('title').textContent=selected.name;$('description').textContent=live?selected.date+' · '+clock(selected.start)+'–'+clock(selected.end)+' (New York time) · '+money(selected.memberCents)+' members / '+money(selected.nonMemberCents)+' non-members. Separate purchase required; not included in monthly memberships.':lesson?selected.description+' Coach, date, and price need confirmation.':selected.type+' · '+selected.dates.map(day=>eventDay(selected,day)).join(' • ')+' · '+money(selected.cents);$('gradeRange').hidden=!selected.gradeRange;$('gradeRange').textContent=selected.gradeRange?'Grade range: '+selected.gradeRange:'';$('offeringDescription').hidden=lesson||!selected.description;$('offeringDescription').textContent=lesson?'':selected.description||'';if(!lesson&&!live&&selected.full){$('form').hidden=true;$('choice').hidden=false;$('status').textContent='This event is full.';return}if(!family.data.wrestlers.length){$('empty').hidden=false;$('status').textContent='Add a wrestler to continue.';return}$('wrestler').replaceChildren(...family.data.wrestlers.map(w=>{const o=document.createElement('option');o.value=w.id;o.textContent=w.name+' · Grade '+w.grade;return o}));$('optionLabel').hidden=live||lesson||selected.type!=='Camp';$('option').innerHTML='<option value="full">'+(live?'Single practice':lesson?'Lesson':'Full event · '+money(selected.cents))+'</option>'+(!lesson&&selected.type==='Camp'&&selected.dayCents!==null?selected.dates.filter(d=>d>=catalog.today).map(d=>'<option value="'+d+'">'+esc(eventDay(selected,d))+' · '+money(selected.dayCents)+'</option>').join(''):'');if(lesson){$('selectedOpening').hidden=false;const openingId=params.get('opening');if(openingId){const month=params.get('month')||'';const a=await call('/api/lesson-availability'+(month?'?month='+encodeURIComponent(month):'')),o=a.openings.find(o=>o.id===openingId);$('selectedOpening').textContent=o?o.coachName+' · '+o.date+' · '+clock(o.start)+'–'+clock(o.end)+' (New York time)':'Selected opening will be rechecked when you review.'}else $('selectedOpening').innerHTML='<a href="/private-lessons">View current coach availability →</a>'}$('choice').hidden=false;$('status').textContent='Review only. No charge or reservation.'}catch(e){$('status').textContent=e.message}}
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('submit').disabled=true;try{const d=await call('/api/booking-review',{type:params.get('type'),id:params.get('id'),format:params.get('format'),date:params.get('date'),opening:params.get('opening'),wrestlerId:$('wrestler').value,option:$('option').value}),r=d.review;$('details').innerHTML='<p><strong>'+esc(r.title)+'</strong></p><p>Wrestler: '+esc(r.wrestler)+'</p>'+(r.dates?'<p>'+r.dates.map(day=>esc(r.type==='event'?eventDay(r,day):day)).join('<br>')+'</p>':'')+(r.coach?'<p>Coach: '+esc(r.coach)+' · '+clock(r.start)+'–'+clock(r.end)+' (New York time)</p>':'')+(r.type==='live'?'<p>'+clock(r.start)+'–'+clock(r.end)+' (New York time)</p><p><strong>'+money(r.memberCents)+' members · '+money(r.nonMemberCents)+' non-members</strong></p><p>Separate purchase · Not included in membership</p>':'<p>'+money(r.cents)+'</p>');$('notice').textContent=r.message;$('review').hidden=false;$('choice').hidden=true;$('status').textContent='Selection reviewed. Registration has not been completed.';$('review').focus()}catch(e){$('status').textContent=e.message}finally{busy=false;$('submit').disabled=false}};load();
</script></body></html>
